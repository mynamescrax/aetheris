<!doctype html>
<html lang="en">
  <head>
    <script src="./js/site.js?v=20260907.1"></script>
    <meta charset="utf-8" />
    <link
      rel="shortcut icon"
      href="./assets/images/icon.png"
      type="image/png"
    />
    <title>Aetheris</title>
    <link rel="stylesheet" href="./css/main.css?v=20260907.1" />
    <link rel="stylesheet" href="./css/cards.css?v=20260907.1" />
    <link rel="stylesheet" href="./css/themes.css?v=20260907.1" />
    <link rel="stylesheet" href="./css/nav.css?v=20260907.1" />
    <script src="register-sw.js?v=20260907.1" defer></script>
    <script defer src="./js/preload.js?v=20260907.1"></script>
    <script defer src="./assets/data/apps.js?v=20260907.1"></script>
    <script defer src="./js/apps.js?v=20260907.1"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="./js/theme.js?v=20260907.1"></script>
    <style>
      @keyframes hvr-bob {
        0% {
          transform: translateY(-8px);
        }
        50% {
          transform: translateY(-4px);
        }
        100% {
          transform: translateY(-8px);
        }
      }
      @keyframes hvr-bob-float {
        100% {
          transform: translateY(-8px);
        }
      }
      .hvr-bob {
        display: inline-block;
        vertical-align: middle;
        transition-duration: 0.3s;
        transition-property: transform;
      }
      .hvr-bob:hover,
      .hvr-bob:focus,
      .hvr-bob:active {
        transform: translateZ(0);
        backface-visibility: hidden;
        animation-name: hvr-bob-float, hvr-bob;
        animation-duration: 0.3s, 1.5s;
        animation-delay: 0s, 0.3s;
        animation-timing-function: ease-out, ease-in-out;
        animation-iteration-count: 1, infinite;
        animation-fill-mode: forwards;
        animation-direction: normal, alternate;
      }
      #favoritedapps:empty {
        display: none;
      }
      .section-label {
        text-align: left;
        padding: 0 24px;
        margin: 4px 0 8px;
        font-size: 13px;
        opacity: 0.7;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
    </style>
    <link rel="stylesheet" href="./css/usability.css?v=20260907.1" />
  </head>
  <body>
    <div class="page-wrapper">
      <h1>Apps</h1>
      <input
        id="search-box"
        type="search"
        aria-label="Search apps"
        placeholder="Search apps…"
        autocomplete="off"
      />
      <div
        class="section-label"
        id="favorited-apps-label"
        style="display: none"
      >
        Favorites
      </div>
      <div class="card-container" id="favoritedapps"></div>
      <div class="card-container" id="appcards"></div>
      <p id="apps-status" class="library-status" role="status">Loading apps…</p>
    </div>
  </body>
</html>
