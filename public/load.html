    <script>
      (function () {
        function injectadblocker(iframe) {
          var win, doc;
          try {
            win = iframe.contentWindow;
            doc = iframe.contentDocument || (win && win.document);
          } catch (e) {
            return;
          }
          if (!win || !doc) return;

          var blockeddomains = [
            "doubleclick.net",
            "googlesyndication.com",
            "adservice.google",
            "googletagmanager.com",
            "googletagservices.com",
            "adnxs.com",
            "amazon-adsystem.com",
            "outbrain.com",
            "taboola.com",
            "moatads.com",
            "pubmatic.com",
            "rubiconproject.com",
            "openx.net",
            "criteo.com",
            "media.net",
            "adsafeprotected.com",
            "spotxchange.com",
            "rlcdn.com",
            "casalemedia.com",
            "2mdn.net",
            "imasdk.googleapis.com",
            "ads.yahoo.com",
            "adsymptotic.com",
            "serving-sys.com",
            "pagead2.googlesyndication.com",
            "securepubads.g.doubleclick.net",
            "ad.doubleclick.net",
            "adsense.google.com",
            "adtech.de",
            "yieldmanager.com",
            "advertising.com",
            "adform.net",
          ];

          var adselectors = [
            "ins.adsbygoogle",
            "[id*='google_ads_iframe']",
            "[id*='google_ads']",
            "[id*='ad-container']",
            "[class*='ad-banner']",
            "[class*='advertisement']",
            "[class*='ad-unit']",
            "[id^='div-gpt-ad']",
            "[class*='gpt-ad']",
            "iframe[src*='doubleclick']",
            "iframe[src*='googlesyndication']",
            "iframe[src*='adnxs']",
            "iframe[src*='2mdn.net']",
            "[data-ad-client]",
            "[id*='taboola']",
            "[class*='taboola']",
            "[id*='outbrain']",
            "[class*='outbrain']",
            "#carbonads",
            ".carbonads",
          ].join(",");

          function isadurl(url) {
            if (!url) return false;
            var u = String(url).toLowerCase();
            for (var i = 0; i < blockeddomains.length; i++) {
              if (u.indexOf(blockeddomains[i]) !== -1) return true;
            }
            return false;
          }

          function removeads(root) {
            if (!root || !root.querySelectorAll) return;
            try {
              var els = root.querySelectorAll(adselectors);
              for (var i = 0; i < els.length; i++) {
                try {
                  if (els[i].parentNode) els[i].parentNode.removeChild(els[i]);
                } catch (e) {}
              }
            } catch (e) {}
          }

          if (typeof win.fetch === "function") {
            var origfetch = win.fetch.bind(win);
            win.fetch = function (input) {
              var url =
                typeof input === "string" ? input : input && (input.url || "");
              if (isadurl(url)) {
                console.debug("[Aetheris] Blocked ad fetch:", url);
                return new Promise(function () {});
              }
              return origfetch.apply(this, arguments);
            };
          }

          if (win.XMLHttpRequest) {
            var xhrproto = win.XMLHttpRequest.prototype;
            var origopen = xhrproto.open;
            var origsend = xhrproto.send;
            xhrproto.open = function (method, url) {
              this.__adBlocked = isadurl(url);
              if (this.__adBlocked) {
                console.debug("[Aetheris] Blocked ad XHR:", url);
                return;
              }
              return origopen.apply(this, arguments);
            };
            xhrproto.send = function () {
              if (this.__adBlocked) return;
              return origsend.apply(this, arguments);
            };
          }

          removeads(doc.documentElement || doc.body);

          if (win.MutationObserver) {
            var adobserver = new win.MutationObserver(function (mutations) {
              for (var i = 0; i < mutations.length; i++) {
                var added = mutations[i].addedNodes;
                for (var j = 0; j < added.length; j++) {
                  var node = added[j];
                  if (node.nodeType !== 1) continue;
                  if (node.matches && node.matches(adselectors)) {
                    try {
                      if (node.parentNode) node.parentNode.removeChild(node);
                    } catch (e) {}
                  } else {
                    removeads(node);
                  }
                }
              }
            });
            try {
              adobserver.observe(doc.documentElement, {
                childList: true,
                subtree: true,
              });
            } catch (e) {}
          }
        }

        function sandboxiframe(iframe) {
          try {
            var current = iframe.getAttribute("sandbox") || "";
            if (current === "") {
              iframe.setAttribute(
                "sandbox",
                "allow-scripts allow-same-origin allow-forms allow-popups " +
                  "allow-pointer-lock allow-downloads allow-modals allow-orientation-lock " +
                  "allow-presentation allow-storage-access-by-user-activation",
              );
            } else {
              var cleaned = current
                .replace(/allow-top-navigation-by-user-activation/g, "")
                .replace(/allow-top-navigation/g, "")
                .replace(/\s+/g, " ")
                .trim();
              iframe.setAttribute("sandbox", cleaned);
            }
          } catch (e) {}
          // Safari requires allow="autoplay" for AudioContext.resume() to work after a gesture
          try {
            if (!iframe.getAttribute("allow")) {
              iframe.setAttribute("allow", "autoplay; fullscreen");
            }
          } catch (e) {}
        }

        function watchiframe(iframe) {
          if (!iframe || iframe.__aetherisWatched) return;
          iframe.__aetherisWatched = true;

          sandboxiframe(iframe);

          var attach = function () {
            try {
              injectadblocker(iframe);
            } catch (e) {}
          };
          iframe.addEventListener("load", attach);
          attach();
        }

        function startobserver() {
          var host = document.getElementById("game-frame");
          if (!host) {
            requestAnimationFrame(startobserver);
            return;
          }

          var existing = host.querySelector("iframe");
          if (existing) watchiframe(existing);

          var mo = new MutationObserver(function (mutations) {
            for (var i = 0; i < mutations.length; i++) {
              var added = mutations[i].addedNodes;
              for (var j = 0; j < added.length; j++) {
                var node = added[j];
                if (node && node.tagName === "IFRAME") watchiframe(node);
                else if (node && node.querySelector) {
                  var nested = node.querySelector("iframe");
                  if (nested) watchiframe(nested);
                }
              }
            }
          });
          mo.observe(host, { childList: true, subtree: true });
        }

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", startobserver, {
            once: true,
          });
        } else {
          startobserver();
        }
      })();
    </script>

    <script>
      function downloadgame() {
        var iframe = document.querySelector("#game-frame iframe");
        if (!iframe || !iframe.src) {
          alert("No game loaded yet.");
          return;
        }

        var gamesrc = location.origin + "/index.html#load" + location.search;
        var titleel = document.getElementById("game-title");
        var rawtitle = (titleel && titleel.textContent.trim()) || "";
        var slug = rawtitle
          ? rawtitle
              .toLowerCase()
              .replace(/[^a-z0-9]+/g, "-")
              .replace(/^-+|-+$/g, "")
          : gamesrc.split("/").pop().split("?")[0] || "game";
        var filename =
          slug.substring(slug.length - 5) === ".html" ? slug : slug + ".html";
        var title = rawtitle || slug;

        var html =
          '<!DOCTYPE html>\n<html lang="en">\n<head>\n' +
          '<meta charset="UTF-8">\n' +
          '<meta name="viewport" content="width=device-width,initial-scale=1.0">\n' +
          "<title>" +
          title.replace(/</g, "&lt;") +
          "</title>\n" +
          "<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden}" +
          "iframe{width:100%;height:100%;border:none}</style>\n" +
          "</head>\n<body>\n" +
          '<iframe src="' +
          gamesrc.replace(/"/g, "&quot;") +
          '" ' +
          'allow="autoplay;fullscreen;gamepad;microphone;camera" ' +
          'sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-pointer-lock allow-downloads allow-modals" ' +
          "allowfullscreen></iframe>\n" +
          "</body>\n</html>";

        var blob = new Blob([html], { type: "text/html" });
        var link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(function () {
          URL.revokeObjectURL(link.href);
        }, 60000);
      }

      function refreshgame() {
        var iframe = document.querySelector("#game-frame iframe");
        if (!iframe) {
          alert("No game loaded yet.");
          return;
        }
        try {
          iframe.contentWindow.location.reload();
          return;
        } catch (e) {}
        // cross-origin fallback: cycle src to avoid stripping query params
        if (!iframe.src) {
          alert("No game loaded yet.");
          return;
        }
        var url = new URL(iframe.src);
        url.searchParams.set("_", Date.now());
        iframe.src = url.href;
      }

      var erudaActive = false;

      function injecterudaintoiframe(iframe) {
        try {
          var doc = iframe.contentDocument || iframe.contentWindow.document;
          if (!doc) return;
          var win = iframe.contentWindow;
          if (win.eruda && win.__erudaInjected) return;
          var s1 = doc.createElement("script");
          s1.src = "https://cdn.jsdelivr.net/npm/eruda";
          s1.onload = function () {
            var s2 = doc.createElement("script");
            s2.textContent = "eruda.init(); window.__erudaInjected = true;";
            doc.body.appendChild(s2);
          };
          doc.body.appendChild(s1);
        } catch (e) {}
      }

      function debuggame() {
        var iframe = document.querySelector("#game-frame iframe");
        if (!iframe) {
          alert("No game loaded yet.");
          return;
        }

        try {
          var doc = iframe.contentDocument || iframe.contentWindow.document;
          if (doc) {
            var win = iframe.contentWindow;

            if (win.eruda && win.__erudaInjected) {
              try {
                win.eruda.destroy();
              } catch (e) {}
              win.__erudaInjected = false;
              erudaActive = false;
              return;
            }

            erudaActive = true;
            injecterudaintoiframe(iframe);
            return;
          }
        } catch (err) {
          console.warn(
            "Cross-origin iframe, toggling Eruda on parent page instead.",
            err,
          );
        }

        if (window.eruda && window.__erudaInjected) {
          try {
            window.eruda.destroy();
          } catch (e) {}
          window.__erudaInjected = false;
          erudaActive = false;
          return;
        }

        erudaActive = true;
        var s = document.createElement("script");
        s.src = "https://cdn.jsdelivr.net/npm/eruda";
        s.onload = function () {
          var init = document.createElement("script");
          init.textContent = "eruda.init(); window.__erudaInjected = true;";
          document.body.appendChild(init);
          alert(
            "Game iframe is cross-origin, so Eruda was attached to the page wrapper instead.",
          );
        };
        s.onerror = function () {
          alert("Failed to load Eruda.");
        };
        document.body.appendChild(s);
      }

      // Re-inject Eruda after iframe refreshes
      document.getElementById("game-frame").addEventListener(
        "load",
        function (e) {
          if (e.target && e.target.tagName === "IFRAME" && erudaActive) {
            injecterudaintoiframe(e.target);
          }
        },
        true,
      );

      function eschtml(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function openinnewtab() {
        var iframe = document.querySelector("#game-frame iframe");
        if (!iframe) {
          alert("No game loaded yet.");
          return;
        }

        // Open the game itself, not another copy of this player page.
        // The live location also follows navigation inside the game;
        // fall back to the src attribute when it can't be read.
        var gameurl = "";
        try {
          var livehref =
            iframe.contentWindow && iframe.contentWindow.location.href;
          if (livehref && livehref !== "about:blank") gameurl = livehref;
        } catch (e) {}
        if (!gameurl) gameurl = iframe.src || iframe.getAttribute("src") || "";
        if (!gameurl || gameurl === "about:blank") {
          alert("No game loaded yet.");
          return;
        }

        // Proxied (/~/sj/...) URLs only route under this tab's Controller,
        // so they can't load in a bare new tab — reopen those through the
        // player shell, which boots its own proxy.
        if (gameurl.indexOf("/~/sj/") !== -1) {
          gameurl = location.origin + "/index.html#load" + location.search;
        }
        var tabtitle = localStorage.getItem("tabName") || "Google Docs";
        var tabicon =
          localStorage.getItem("tabIcon") ||
          "https://ssl.gstatic.com/docs/documents/images/kix-favicon7.ico";

        var newwindow = window.open("about:blank", "_blank");
        if (!newwindow) {
          alert("Popup blocked. Please allow popups for this site.");
          return;
        }

        newwindow.document.write(
          "<!DOCTYPE html><html><head>" +
            "<title>" +
            eschtml(tabtitle) +
            "</title>" +
            '<link rel="icon" href="' +
            eschtml(tabicon) +
            '">' +
            "<style>body{margin:0;overflow:hidden;background:#000}" +
            "iframe{border:none;width:100vw;height:100vh;position:fixed;inset:0}</style>" +
            "</head><body>" +
            '<iframe src="' +
            eschtml(gameurl) +
            '" allowfullscreen allow="autoplay; fullscreen" referrerpolicy="no-referrer"' +
            ' sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-pointer-lock allow-downloads allow-modals allow-orientation-lock allow-presentation allow-storage-access-by-user-activation"></iframe>' +
            "</body></html>",
        );
        newwindow.document.close();
      }

      (function () {
        if (localStorage.getItem("leftHanded") === "true") {
          document.body.classList.add("left-handed");
        }
      })();

      function togglehandedmode() {
        var isleft = document.body.classList.toggle("left-handed");
        localStorage.setItem("leftHanded", isleft ? "true" : "false");
        document.getElementById("handed-btn").title = isleft
          ? "Switch to right-handed mode"
          : "Switch to left-handed mode";
      }

      var chatopen = false;
      var chatloaded = false;

      function togglechat() {
        var panel = document.getElementById("chat-panel");
        chatopen = !chatopen;
        if (chatopen) {
          if (!chatloaded) {
            document.getElementById("chat-iframe").src = "./minichat.html";
            chatloaded = true;
          }
          panel.style.display = "block";
          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              panel.classList.add("open");
            });
          });
          document.getElementById("chat-pill-badge").style.display = "none";
        } else {
          panel.classList.remove("open");
          setTimeout(function () {
            if (!chatopen) panel.style.display = "none";
          }, 220);
        }
      }

      document.addEventListener("DOMContentLoaded", function () {
        var tools = document.getElementById("player-extra-tools");
        document
          .querySelectorAll(".chat-pill, .report-pill, .osk-pill")
          .forEach(function (button) {
            tools.appendChild(button);
          });
        document
          .querySelectorAll(".action-buttons button")
          .forEach(function (button) {
            if (!button.hasAttribute("aria-label"))
              button.setAttribute("aria-label", button.title);
          });
      });

      window.addEventListener("message", function (e) {
        var data = e.data;
        if (!data || typeof data !== "object") return;

        // Chat unread badge — same-origin only, otherwise any embedded
        // (proxied/game) frame could spoof the badge count
        if (
          e.origin === location.origin &&
          e.source === document.getElementById("chat-iframe").contentWindow &&
          data.type === "chat-unread" &&
          !chatopen
        ) {
          var badge = document.getElementById("chat-pill-badge");
          if (data.count > 0) {
            badge.textContent = data.count > 99 ? "99+" : data.count;
            badge.style.display = "flex";
          } else {
            badge.style.display = "none";
          }
          return;
        }

        // Preserve the existing message protocol, but never acknowledge a
        // successful save while discarding the content. Scope saves to the
        // selected game, requester origin, and slot.
        var saveactions = ["load", "load_content", "save_content", "save"];
        if (saveactions.indexOf(data.action) !== -1) {
          var gameFrame = document.querySelector("#game-frame iframe");
          if (!gameFrame || e.source !== gameFrame.contentWindow) return;
          var content = "",
            error = false,
            detail = "ok";
          try {
            var slot = data.slot == null ? "default" : String(data.slot);
            if (slot.length > 128) throw new Error("Invalid save slot.");
            var key =
              "aetheris-save:" +
              encodeURIComponent(location.search) +
              ":" +
              encodeURIComponent(e.origin) +
              ":" +
              encodeURIComponent(slot);
            if (data.action === "save" || data.action === "save_content") {
              if (data.content === undefined)
                throw new Error("No save content supplied.");
              var encoded = JSON.stringify(
                data.content,
                function (_key, value) {
                  if (
                    value instanceof ArrayBuffer ||
                    ArrayBuffer.isView(value) ||
                    value instanceof Blob ||
                    value instanceof Map ||
                    value instanceof Set ||
                    typeof value === "bigint" ||
                    typeof value === "undefined" ||
                    (typeof value === "number" && !Number.isFinite(value))
                  ) {
                    throw new Error(
                      "This save API requires JSON-compatible content.",
                    );
                  }
                  return value;
                },
              );
              if (!encoded || encoded.length > 2 * 1024 * 1024)
                throw new Error("Save content is too large.");
              localStorage.setItem(key, encoded);
              content = data.content;
            } else {
              var saved = localStorage.getItem(key);
              content = saved === null ? "" : JSON.parse(saved);
            }
          } catch (saveError) {
            error = true;
            detail = saveError.message;
          }
          e.source.postMessage(
            {
              type: "save_content",
              error: error,
              message: detail,
              content: content,
              slot: data.slot,
            },
            e.origin === "null" ? "*" : e.origin,
          );
        }
      });
    </script>

        <div

    <script>
      (function () {
        if (localStorage.getItem("oskEnabled") !== "true") return;

        var scale = Math.max(
          0.5,
          Math.min(1.5, parseFloat(localStorage.getItem("oskScale") || "1")),
        );
        var mods = { shift: false, ctrl: false, alt: false, caps: false };
        var oskVisible = false,
          positioned = false;
        var dragging = false,
          dragOffX = 0,
          dragOffY = 0;

        var ROWS = [
          [
            { l: "Esc", k: "Escape", c: "Escape" },
            { l: "`", k: "`", c: "Backquote", s: "~" },
            { l: "1", k: "1", c: "Digit1", s: "!" },
            { l: "2", k: "2", c: "Digit2", s: "@" },
            { l: "3", k: "3", c: "Digit3", s: "#" },
            { l: "4", k: "4", c: "Digit4", s: "$" },
            { l: "5", k: "5", c: "Digit5", s: "%" },
            { l: "6", k: "6", c: "Digit6", s: "^" },
            { l: "7", k: "7", c: "Digit7", s: "&" },
            { l: "8", k: "8", c: "Digit8", s: "*" },
            { l: "9", k: "9", c: "Digit9", s: "(" },
            { l: "0", k: "0", c: "Digit0", s: ")" },
            { l: "-", k: "-", c: "Minus", s: "_" },
            { l: "=", k: "=", c: "Equal", s: "+" },
            { l: "⌫", k: "Backspace", c: "Backspace", w: "wide" },
          ],
          [
            { l: "Tab", k: "Tab", c: "Tab", w: "wide" },
            { l: "Q", k: "q", c: "KeyQ", s: "Q" },
            { l: "W", k: "w", c: "KeyW", s: "W" },
            { l: "E", k: "e", c: "KeyE", s: "E" },
            { l: "R", k: "r", c: "KeyR", s: "R" },
            { l: "T", k: "t", c: "KeyT", s: "T" },
            { l: "Y", k: "y", c: "KeyY", s: "Y" },
            { l: "U", k: "u", c: "KeyU", s: "U" },
            { l: "I", k: "i", c: "KeyI", s: "I" },
            { l: "O", k: "o", c: "KeyO", s: "O" },
            { l: "P", k: "p", c: "KeyP", s: "P" },
            { l: "[", k: "[", c: "BracketLeft", s: "{" },
            { l: "]", k: "]", c: "BracketRight", s: "}" },
            { l: "\\", k: "\\", c: "Backslash", s: "|" },
          ],
          [
            { l: "Caps", k: "CapsLock", c: "CapsLock", w: "wider", m: "caps" },
            { l: "A", k: "a", c: "KeyA", s: "A" },
            { l: "S", k: "s", c: "KeyS", s: "S" },
            { l: "D", k: "d", c: "KeyD", s: "D" },
            { l: "F", k: "f", c: "KeyF", s: "F" },
            { l: "G", k: "g", c: "KeyG", s: "G" },
            { l: "H", k: "h", c: "KeyH", s: "H" },
            { l: "J", k: "j", c: "KeyJ", s: "J" },
            { l: "K", k: "k", c: "KeyK", s: "K" },
            { l: "L", k: "l", c: "KeyL", s: "L" },
            { l: ";", k: ";", c: "Semicolon", s: ":" },
            { l: "'", k: "'", c: "Quote", s: '"' },
            { l: "Enter", k: "Enter", c: "Enter", w: "wider" },
          ],
          [
            { l: "⇧", k: "Shift", c: "ShiftLeft", w: "wider", m: "shift" },
            { l: "Z", k: "z", c: "KeyZ", s: "Z" },
            { l: "X", k: "x", c: "KeyX", s: "X" },
            { l: "C", k: "c", c: "KeyC", s: "C" },
            { l: "V", k: "v", c: "KeyV", s: "V" },
            { l: "B", k: "b", c: "KeyB", s: "B" },
            { l: "N", k: "n", c: "KeyN", s: "N" },
            { l: "M", k: "m", c: "KeyM", s: "M" },
            { l: ",", k: ",", c: "Comma", s: "<" },
            { l: ".", k: ".", c: "Period", s: ">" },
            { l: "/", k: "/", c: "Slash", s: "?" },
            { l: "⇧", k: "Shift", c: "ShiftRight", w: "wider", m: "shift" },
          ],
          [
            {
              l: "Ctrl",
              k: "Control",
              c: "ControlLeft",
              w: "wider",
              m: "ctrl",
            },
            { l: "Alt", k: "Alt", c: "AltLeft", m: "alt" },
            { l: "Space", k: " ", c: "Space", w: "space" },
            { l: "Alt", k: "Alt", c: "AltRight", m: "alt" },
            {
              l: "Ctrl",
              k: "Control",
              c: "ControlRight",
              w: "wider",
              m: "ctrl",
            },
            { l: "←", k: "ArrowLeft", c: "ArrowLeft" },
            { l: "↑", k: "ArrowUp", c: "ArrowUp" },
            { l: "↓", k: "ArrowDown", c: "ArrowDown" },
            { l: "→", k: "ArrowRight", c: "ArrowRight" },
          ],
        ];

        // Build panel
        var panel = document.createElement("div");
        panel.className = "osk-panel";
        panel.id = "osk-panel";

        var handle = document.createElement("div");
        handle.className = "osk-handle";

        function mkctrl(txt, title) {
          var b = document.createElement("button");
          b.className = "osk-ctrl-btn";
          b.textContent = txt;
          b.title = title;
          return b;
        }

        var minusBtn = mkctrl("−", "Shrink keyboard");
        var titleEl = document.createElement("div");
        titleEl.className = "osk-title";
        titleEl.textContent = "⠇ keyboard";
        var plusBtn = mkctrl("+", "Grow keyboard");
        var closeBtn = mkctrl("×", "Close keyboard");

        handle.appendChild(minusBtn);
        handle.appendChild(titleEl);
        handle.appendChild(plusBtn);
        handle.appendChild(closeBtn);
        panel.appendChild(handle);

        var rowsEl = document.createElement("div");
        rowsEl.className = "osk-rows";
        var allKeys = [];

        ROWS.forEach(function (row) {
          var rowEl = document.createElement("div");
          rowEl.className = "osk-row";
          row.forEach(function (kd) {
            var btn = document.createElement("button");
            btn.className = "osk-key";
            btn.setAttribute("tabindex", "-1");
            btn.textContent = kd.l;
            if (kd.w) btn.dataset.w = kd.w;
            if (kd.m) btn.dataset.mod = kd.m;
            btn.dataset.key = kd.k;
            btn.dataset.code = kd.c;
            if (kd.s) btn.dataset.shift = kd.s;
            rowEl.appendChild(btn);
            allKeys.push(btn);
          });
          rowsEl.appendChild(rowEl);
        });

        panel.appendChild(rowsEl);
        document.body.appendChild(panel);

        // Pill button
        var pill = document.createElement("button");
        pill.className = "osk-pill";
        pill.id = "osk-pill-btn";
        pill.setAttribute("aria-label", "Toggle on-screen keyboard");
        pill.innerHTML =
          '<span style="font-size:1rem;line-height:1">⌨</span><span>Keys</span>';
        document.body.appendChild(pill);

        // Scale
        function applyScale() {
          var fit = panel.offsetWidth
            ? Math.min(scale, (window.innerWidth - 16) / panel.offsetWidth)
            : scale;
          panel.style.transform = "scale(" + fit + ")";
        }
        applyScale();

        // Mod UI
        function updateMods() {
          allKeys.forEach(function (btn) {
            var m = btn.dataset.mod;
            if (m) btn.classList.toggle("osk-mod-on", !!mods[m]);
          });
        }

        function sendKey(type, key, code) {
          var iframe = document.querySelector("#game-frame iframe");
          if (!iframe) return;
          try {
            var win = iframe.contentWindow;
            var doc = iframe.contentDocument || win.document;
            var opts = {
              key: key,
              code: code,
              bubbles: true,
              cancelable: true,
              composed: true,
              shiftKey: mods.shift || mods.caps,
              ctrlKey: mods.ctrl,
              altKey: mods.alt,
            };
            var target =
              doc.activeElement && doc.activeElement !== doc.body
                ? doc.activeElement
                : doc.body || doc.documentElement;
            target.dispatchEvent(new win.KeyboardEvent(type, opts));
          } catch (e) {}
        }

        // Key interaction
        allKeys.forEach(function (btn) {
          var mod = btn.dataset.mod;
          var down = null;

          function releaseKey() {
            btn.classList.remove("osk-pressed");
            if (!down) return;
            sendKey("keyup", down.key, down.code);
            down = null;
            if (mods.shift) {
              sendKey("keyup", "Shift", "ShiftLeft");
              mods.shift = false;
              updateMods();
            }
          }
          btn.releaseOskKey = releaseKey;

          btn.addEventListener("pointerdown", function (e) {
            e.preventDefault();
            if (btn.setPointerCapture) btn.setPointerCapture(e.pointerId);
            btn.classList.add("osk-pressed");
            if (mod) {
              mods[mod] = !mods[mod];
              updateMods();
              sendKey(
                mods[mod] ? "keydown" : "keyup",
                btn.dataset.key,
                btn.dataset.code,
              );
              return;
            }
            var key = btn.dataset.key;
            var code = btn.dataset.code;
            if ((mods.shift || mods.caps) && btn.dataset.shift)
              key = btn.dataset.shift;
            down = { key: key, code: code };
            sendKey("keydown", key, code);
          });

          btn.addEventListener("pointerup", function (e) {
            e.preventDefault();
            btn.classList.remove("osk-pressed");
            if (mod) return;
            releaseKey();
          });

          btn.addEventListener("pointercancel", releaseKey);
          btn.addEventListener("lostpointercapture", releaseKey);
        });

        // Show/hide
        function showOsk() {
          oskVisible = true;
          panel.style.visibility = "hidden";
          panel.classList.add("osk-visible");
          applyScale();
          if (!positioned) {
            var r = panel.getBoundingClientRect();
            var gameBounds = document
              .getElementById("game-frame")
              .getBoundingClientRect();
            panel.style.left =
              Math.max(0, gameBounds.left + (gameBounds.width - r.width) / 2) +
              "px";
            panel.style.top =
              Math.max(0, gameBounds.bottom - r.height - 12) + "px";
            positioned = true;
          }
          panel.style.visibility = "";
        }

        function hideOsk() {
          releaseAllKeys();
          oskVisible = false;
          panel.classList.remove("osk-visible");
        }
        function releaseAllKeys() {
          allKeys.forEach(function (btn) {
            if (btn.releaseOskKey) btn.releaseOskKey();
          });
          [
            ["shift", "Shift", "ShiftLeft"],
            ["ctrl", "Control", "ControlLeft"],
            ["alt", "Alt", "AltLeft"],
            ["caps", "CapsLock", "CapsLock"],
          ].forEach(function (m) {
            if (mods[m[0]]) sendKey("keyup", m[1], m[2]);
            mods[m[0]] = false;
          });
          updateMods();
        }
        window.addEventListener("blur", releaseAllKeys);
        window.addEventListener("resize", function () {
          if (!oskVisible) return;
          applyScale();
          var rect = panel.getBoundingClientRect();
          panel.style.left =
            Math.max(0, Math.min(rect.left, window.innerWidth - rect.width)) +
            "px";
          panel.style.top =
            Math.max(0, Math.min(rect.top, window.innerHeight - rect.height)) +
            "px";
        });

        pill.addEventListener("click", function () {
          if (oskVisible) hideOsk();
          else showOsk();
        });

        closeBtn.addEventListener("click", function (e) {
          e.stopPropagation();
          hideOsk();
        });

        // Size controls
        plusBtn.addEventListener("click", function (e) {
          e.stopPropagation();
          scale = Math.min(1.5, +(scale + 0.1).toFixed(1));
          localStorage.setItem("oskScale", scale);
          applyScale();
          if (positioned) {
            var r = panel.getBoundingClientRect();
            panel.style.left =
              Math.max(
                0,
                Math.min(
                  parseFloat(panel.style.left) || 0,
                  window.innerWidth - r.width,
                ),
              ) + "px";
            panel.style.top =
              Math.max(
                0,
                Math.min(
                  parseFloat(panel.style.top) || 0,
                  window.innerHeight - r.height,
                ),
              ) + "px";
          }
        });

        minusBtn.addEventListener("click", function (e) {
          e.stopPropagation();
          scale = Math.max(0.5, +(scale - 0.1).toFixed(1));
          localStorage.setItem("oskScale", scale);
          applyScale();
          if (positioned) {
            var r = panel.getBoundingClientRect();
            panel.style.left =
              Math.max(
                0,
                Math.min(
                  parseFloat(panel.style.left) || 0,
                  window.innerWidth - r.width,
                ),
              ) + "px";
            panel.style.top =
              Math.max(
                0,
                Math.min(
                  parseFloat(panel.style.top) || 0,
                  window.innerHeight - r.height,
                ),
              ) + "px";
          }
        });

        // Drag (on handle, not on control buttons)
        handle.addEventListener("pointerdown", function (e) {
          if (e.target.classList.contains("osk-ctrl-btn")) return;
          e.preventDefault();
          dragging = true;
          handle.setPointerCapture(e.pointerId);
          var r = panel.getBoundingClientRect();
          dragOffX = e.clientX - r.left;
          dragOffY = e.clientY - r.top;
          document.addEventListener("pointermove", onDragMove);
          document.addEventListener("pointerup", onDragEnd);
          document.addEventListener("pointercancel", onDragEnd);
        });

        function onDragMove(e) {
          var r = panel.getBoundingClientRect();
          var newL = Math.max(
            0,
            Math.min(e.clientX - dragOffX, window.innerWidth - r.width),
          );
          var newT = Math.max(
            0,
            Math.min(e.clientY - dragOffY, window.innerHeight - r.height),
          );
          panel.style.left = newL + "px";
          panel.style.top = newT + "px";
        }

        function onDragEnd() {
          dragging = false;
          document.removeEventListener("pointermove", onDragMove);
          document.removeEventListener("pointerup", onDragEnd);
          document.removeEventListener("pointercancel", onDragEnd);
        }
      })();
    </script>

    <script>
      // getdeviceid lives in ./js/dm-shared.js (loaded in <head>)

      var reporttype = "";

      function pickreporttype(btn, label) {
        var all = document.querySelectorAll(".rtype");
        for (var i = 0; i < all.length; i++)
          all[i].classList.remove("selected");
        btn.classList.add("selected");
        reporttype = label;
      }

      function openreport() {
        var titleel = document.getElementById("game-title");
        var gamename =
          (titleel && titleel.textContent.trim()) || "Unknown game";
        document.getElementById("report-game-name").textContent = gamename;

        reporttype = "";
        var btns = document.querySelectorAll(".rtype");
        for (var i = 0; i < btns.length; i++)
          btns[i].classList.remove("selected");
        document.getElementById("report-steps").value = "";
        document.getElementById("report-notes").value = "";
        document.getElementById("report-status").style.display = "none";
        document.getElementById("report-submit").disabled = false;
        document.getElementById("report-submit").textContent = "send it";

        var overlay = document.getElementById("report-overlay");
        var modal = document.getElementById("report-modal");

        overlay.style.display = "flex";
        modal.style.opacity = "0";
        modal.style.transform = "scale(0.92) translateY(12px)";
        modal.style.transition =
          "opacity 0.22s ease, transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1)";

        requestAnimationFrame(function () {
          modal.style.opacity = "1";
          modal.style.transform = "scale(1) translateY(0)";
        });
      }

      function closereport() {
        var overlay = document.getElementById("report-overlay");
        var modal = document.getElementById("report-modal");
        modal.style.opacity = "0";
        modal.style.transform = "scale(0.92) translateY(8px)";
        setTimeout(function () {
          overlay.style.display = "none";
        }, 200);
      }

      document
        .getElementById("report-overlay")
        .addEventListener("click", function (e) {
          if (e.target === this) closereport();
        });

      async function sendreport() {
        var steps = document.getElementById("report-steps").value.trim();
        var notes = document.getElementById("report-notes").value.trim();
        var gamename =
          document.getElementById("report-game-name").textContent || "Unknown";
        var submitbtn = document.getElementById("report-submit");

        if (!reporttype) {
          showstatus("pick a type first", "warn");
          return;
        }
        if (!steps) {
          showstatus("describe what happened first", "warn");
          return;
        }

        submitbtn.disabled = true;
        submitbtn.textContent = "sending...";

        try {
          var devid = await getdeviceid();
          var res = await fetch("/api/report", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              game: gamename,
              issue: reporttype,
              steps: steps,
              notes: notes || undefined,
              url: window.location.href,
              deviceId: devid,
            }),
          });

          var data = await res.json().catch(function () {
            return {};
          });

          if (!res.ok) throw new Error(data.error || "HTTP " + res.status);

          showstatus("sent! thanks for the heads up", "ok");
          submitbtn.textContent = "sent!";
          setTimeout(closereport, 1800);
        } catch (err) {
          showstatus(err.message || "failed to send. try again.", "err");
          submitbtn.disabled = false;
          submitbtn.textContent = "send it";
          console.error("report error:", err);
        }
      }

      function showstatus(message, type) {
        var el = document.getElementById("report-status");
        var colours = {
          ok: {
            bg: "rgba(34,197,94,0.15)",
            color: "#86efac",
            border: "rgba(34,197,94,0.3)",
          },
          warn: {
            bg: "rgba(234,179,8,0.15)",
            color: "#fde047",
            border: "rgba(234,179,8,0.3)",
          },
          err: {
            bg: "rgba(239,68,68,0.15)",
            color: "#fca5a5",
            border: "rgba(239,68,68,0.3)",
          },
        };
        var c = colours[type] || colours.err;
        el.textContent = message;
        el.style.display = "block";
        el.style.background = c.bg;
        el.style.color = c.color;
        el.style.border = "1px solid " + c.border;
      }
    </script>
  </body>
</html>
