<!DOCTYPE html>
<html lang="en-us">

<head>
  <base href="https://cdn.jsdelivr.net/gh/bubbls/youtube-playables@213d19aad1db5acdebe8e07a80ae4998f3146e33/bridge-race/">
  <meta charset="UTF-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">

  <title>Bridge Race</title>
  <link rel="stylesheet" href="TemplateData/style.css" nonce="xc9yLMIA-AeOcD4uccnAOg">
  <script nonce="xc9yLMIA-AeOcD4uccnAOg">
if (!window.ytgame) {
  window.ytgame = {
    SDK_VERSION: "standalone",
    IN_PLAYABLES_ENV: false,
    SdkError: function (t) { this.errorType = t; this.message = ""; },
    SdkErrorType: { UNDEFINED: 0, GAMEAPI_UNDEFINED: 1 },
    game: {
      firstFrameReady: function () {},
      gameReady: function () {},
      // Unity asks for the save during startup, before its message target exists.
      loadData: function () {
        return unityReady.then(function () { return localStorage.getItem("bridge-race-save") || ""; });
      },
      saveData: function (data) { localStorage.setItem("bridge-race-save", data); return Promise.resolve(); }
    },
    engagement: { sendScore: function () { return Promise.resolve(); } },
    ads: {
      requestAd: function () { return Promise.resolve(3); },
      requestInterstitialAd: function () { return Promise.resolve(); },
      AdResult: { UNKNOWN: 0, SHOWED: 1, REJECTED: 3, DISMISSED: 2 }
    },
    health: { logError: function () {}, logWarning: function () {} },
    system: {
      getLanguage: function () { return Promise.resolve("en"); },
      isAudioEnabled: function () { return true; },
      onAudioEnabledChange: function () { return function () {}; },
      onPause: function () { return function () {}; },
      onResume: function () { return function () {}; }
    }
  };
  window.ytgamehelper = { myConsoleLog: function () {} };
}
</script>
</head>

<body>
  <div id="unity-container" class="unity-desktop">
    <canvas id="unity-canvas" width=100% height=100% tabindex="-1"></canvas>
    <div id="unity-loading-bar">
      <div id="unity-logo"></div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>
    <div id="unity-warning"> </div>
  </div>

  <script nonce="xc9yLMIA-AeOcD4uccnAOg"> // Logic for Unity contianer
    var container = document.querySelector("#unity-container");
    var canvas = document.querySelector("#unity-canvas");
    var loadingBar = document.querySelector("#unity-loading-bar");
    var progressBarFull = document.querySelector("#unity-progress-bar-full");
    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/BridgeRace.loader.js";
    var config = {
      dataUrl: buildUrl + "/BridgeRace.data.unityweb",
      frameworkUrl: buildUrl + "/BridgeRace.framework.js.unityweb",
        codeUrl: buildUrl + "/BridgeRace.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Garawell",
      productName: "Bridge Race",
      productVersion: "3.21",
      showBanner: (message, type) => {
        if (type === 'error') document.querySelector('#unity-warning').textContent = message;
      },
    };

    // By default, Unity keeps WebGL canvas render target size matched with
    // the DOM size of the canvas element (scaled by window.devicePixelRatio)
    // Set this to false if you want to decouple this synchronization from
    // happening inside the engine, and you would instead like to size up
    // the canvas DOM size and WebGL render target sizes yourself.
    // config.matchWebGLToCanvasSize = false;

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      // Mobile device style: fill the whole browser client area with the game canvas:

      var meta = document.createElement('meta');
      meta.name = 'viewport';
      meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
      document.getElementsByTagName('head')[0].appendChild(meta);
      container.className = "unity-mobile";
      canvas.className = "unity-mobile";

      // To lower canvas resolution on mobile devices to gain some
      // performance, uncomment the following line:
      // config.devicePixelRatio = 1;

    } else {
      // Desktop style: Render the game canvas in a window that can be maximized to fullscreen:
      canvas.style.width = "100%";
      canvas.style.height = "100%";
    }

    loadingBar.style.display = "block";

    var unityGameInstance = null;
    var unityReady;
    function InitUnitySection() {
      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        unityReady = createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          unityGameInstance = unityInstance;
          loadingBar.style.display = "none";
        });
        unityReady.catch(console.error);
      };

      document.body.appendChild(script);
    }

    InitUnitySection();
  </script>
</body>
</html>
