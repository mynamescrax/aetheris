  <script>
    // Local stand-in for YouTube Playables' game_api. The upstream ytgame.js
    // stub only completes its handshake inside YouTube's portal; anywhere
    // else its loadData() promise never settles and boot stalls on a blank
    // screen. Resolve everything locally instead.
    window.ytgame = {
      SDK_VERSION: "aetheris-shim-1",
      game: {
        firstFrameReady: function () {},
        gameReady: function () {},
        loadData: function () {
          return Promise.resolve(null);
        },
        saveData: function () {
          return Promise.resolve();
        },
      },
      system: {
        isAudioEnabled: function () {
          return true;
        },
        onAudioEnabledChange: function () {},
        onPause: function () {},
        onResume: function () {},
      },
      ads: {
        AdResult: { UNKNOWN: 0, SHOWED: 1, REJECTED: 2 },
        requestAd: function () {
          return Promise.resolve(2);
        },
      },
      engagement: {
        sendScore: function () {
          return Promise.resolve();
        },
      },
    };
    ytgame.game.firstFrameReady();
  </script>
