<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Minecraft 1.9</title>
<meta name="description" content="Play Minecraft 1.9 in your browser (EaglercraftL)" />
<meta name="keywords" content="eaglercraft, minecraft, 1.9" />
<style>
html, body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background: #000; }
#game_frame { width: 100vw; height: 100vh; border: 0; display: block; }
</style>
</head>
<body>
<iframe id="game_frame" src="https://tonydsas.github.io/eaglercraftoffline/eaglercraftx-194.html" allow="fullscreen; autoplay; gamepad; clipboard-read; clipboard-write" allowfullscreen title="Minecraft 1.9"></iframe>
<script>
(function () {
  try {
    var q = new URLSearchParams(window.location.search);
    var s = q.get("server");
    if (s) {
      var f = document.getElementById("game_frame");
      var u = new URL(f.src);
      u.searchParams.set("server", s);
      f.src = u.toString();
    }
  } catch (e) {}
})();
</script>
</body>
</html>
