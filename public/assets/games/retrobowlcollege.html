<!doctype html>
<html lang="en">
  <head>
    <base href="https://cdn.jsdelivr.net/gh/SenpaiX1/ghdfhres@latest/" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"
    />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta charset="utf-8" />
    <meta http-equiv="pragma" content="no-cache" />
    <title>Retro Bowl College</title>
    <style>
      body {
        background: #000;
        color: #ccc;
        margin: 0;
        padding: 0;
        border: 0;
      }
      canvas {
        image-rendering: pixelated;
        -webkit-interpolation-mode: nearest-neighbor;
        -ms-touch-action: none;
        touch-action: none;
        margin: 0;
        padding: 0;
        border: 0;
      }
      :-webkit-full-screen #canvas,
      :-webkit-full-screen {
        width: 100%;
        height: 100%;
      }
      div.gm4html5_div_class {
        margin: 0;
        padding: 0;
        border: 0;
      }
    </style>
  </head>
  <body>
    <div class="gm4html5_div_class" id="gm4html5_div_id">
      <img
        src="html5game/splash.png"
        id="GM4HTML5_loadingscreen"
        alt="Loading"
        style="display: none"
      />
      <canvas
        id="canvas"
        width="853"
        height="480"
        style="position: absolute; top: 50%; left: 50%; bottom: -50%; right: -50%; transform: translate(-50%, -50%)"
      >
        Your browser doesn't support HTML5 canvas.
      </canvas>
    </div>
    <script
      type="text/javascript"
      src="https://cdn.jsdelivr.net/gh/bubbls/UGS-Assets@1523e1e73e0b1c006b7e17639135d68b79f6e4d8/retro%20bowl/html5game/RetroBowl.js"
    ></script>
    <script src="poki-sdk.js"></script>
    <script>
      window.onload = GameMaker_Init;
    </script>
  </body>
</html>
