<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Learn to Fly 2</title>
  <style>html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}ruffle-player{display:block;width:100%;height:100%}#status{color:#fff;font:16px system-ui;padding:20px}</style>
  <script src="https://cdn.jsdelivr.net/npm/@ruffle-rs/ruffle@0.2.0-nightly.2025.10.2/ruffle.min.js"></script>
</head>
<body>
  <p id="status" role="status">Loading…</p>
  <script>
    window.addEventListener("load", async function () {
      const status = document.getElementById("status");
      try {
        const player = window.RufflePlayer.newest().createPlayer();
        document.body.appendChild(player);
        await player.ruffle().load({url: "https://cdn.jsdelivr.net/gh/supaub/interstellar-3@8a13c735e7df6d86602b354e45c090405f21f45a/play/flash/swf/learn2fly2.swf", scale: "showAll"});
        status.remove();
      } catch (error) {
        status.textContent = "The game could not start. Reload to try again.";
        console.error(error);
      }
    });
  </script>
</body>
</html>
