<!doctype html>
<html lang="en">

    <title>Escape Road City 2</title>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }

  <body>

         but rejects a self-hosted Unity build on aetheris.win. The game player
         proxies this wrapper and its nested frame through Scramjet. -->

      title="Escape Road City 2"
      src="https://game.azgame.io/escape-road-city-2/"
      allow="autoplay; fullscreen; gamepad"
      allowfullscreen
    ></iframe>
  </body>
