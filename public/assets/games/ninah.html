<style>
  :root { color-scheme: dark; --bg: #07080a; --panel: rgba(12, 14, 18, 0.86); --ink: #e8ecf1; --dim: #8b95a3; --accent: #5fbf3f; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; }
  canvas { display: block; background: #000; width: min(100vw, calc(100vh * 16 / 9)); height: min(100vh, calc(100vw * 9 / 16)); outline: none; image-rendering: auto; grid-area: 1 / 1; }
  #canvas { background: transparent; }
  #overlay { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(ellipse at center, rgba(20, 24, 30, 0.75), rgba(0, 0, 0, 0.95)); transition: opacity .4s; }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  .rxc-direct #overlay .resolution, .rxc-direct #overlay:not(.startup-error) #play { display: none; }
  .card { width: min(520px, calc(100vw - 32px)); text-align: center; padding: 28px 24px; }
  .card h1 { margin: 0 0 6px; font-size: 34px; letter-spacing: .02em; }
  .card p { margin: 0 0 22px; color: var(--dim); }
  .resolution { display: block; margin: 0 0 16px; color: var(--dim); }
  select { font: inherit; color: var(--ink); background: #151820; border: 1px solid #404550; border-radius: 6px; padding: 5px 9px; margin-left: 6px; }
  #resolution-hud { font-size: 12px; }
  #play { font: inherit; font-size: 17px; font-weight: 600; color: #111; background: var(--accent); border: 0; border-radius: 10px; padding: 12px 34px; cursor: pointer; }
  #play:disabled { opacity: .5; cursor: default; }
  #status { margin-top: 18px; min-height: 1.4em; color: var(--dim); font-variant-numeric: tabular-nums; }
  #startup-log { display: none; max-height: 180px; overflow: auto; margin: 14px 0 0; padding: 10px; text-align: left; white-space: pre-wrap; overflow-wrap: anywhere; background: #050607; border: 1px solid #30343b; border-radius: 6px; color: #b5c0ca; font: 11px/1.4 ui-monospace, monospace; }
  #startup-log.show { display: block; }
  #elapsed { order: 4; flex-basis: 100%; color: var(--dim); font-variant-numeric: tabular-nums; }
  #bar { height: 4px; margin-top: 10px; background: rgba(255,255,255,.08); border-radius: 2px; overflow: hidden; }
  #bar > div { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  #bar.indeterminate > div { width: 35% !important; transition: none; animation: loading-sweep 1.4s ease-in-out infinite; }
  @keyframes loading-sweep { from { transform: translateX(-100%); } to { transform: translateX(290%); } }
  #hud { position: fixed; top: 8px; right: 10px; display: flex; gap: 8px; align-items: center; opacity: .0; transition: opacity .3s; }
  body:hover #hud, #hud.show { opacity: 1; }
  #hud button { font: inherit; font-size: 12px; color: var(--ink); background: var(--panel); border: 1px solid rgba(255,255,255,.1); border-radius: 7px; padding: 4px 10px; cursor: pointer; }
  #fps { font: 12px ui-monospace, monospace; color: var(--dim); background: var(--panel); padding: 4px 8px; border-radius: 7px; display: none; }
  #log { position: fixed; left: 0; right: 0; bottom: 0; height: 38vh; margin: 0; padding: 8px 12px; overflow: auto; white-space: pre-wrap; font: 11px/1.35 ui-monospace, monospace; color: #9aa6b4; background: rgba(5, 6, 8, .92); border-top: 1px solid #222; display: none; }
  #hint { position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); font-size: 12px; color: var(--dim); background: var(--panel); padding: 5px 12px; border-radius: 8px; opacity: 0; transition: opacity .4s; pointer-events: none; }
  #locked-cursor { position: fixed; pointer-events: none; z-index: 2; color: white; text-shadow: 0 1px 2px black; }
  #canvas[style*="cursor: none"] + #locked-cursor { display: none; }
  #port-credit { position: fixed; right: 10px; bottom: 8px; z-index: 3; color: rgba(255,255,255,.6); font-size: 11px; text-align: right; text-shadow: 0 1px 2px #000; }
  #port-credit a { color: inherit; }
  #hint.show { opacity: 1; }
  #busy { position: fixed; right: 18px; bottom: 18px; display: flex; align-items: center; gap: 10px; font-size: 13px; color: #fff; background: rgba(0,0,0,.55); padding: 8px 14px; border-radius: 10px; opacity: 0; transition: opacity .3s; pointer-events: none; }
  #busy.show { opacity: 1; }
  #busy i { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: spin .8s linear infinite; will-change: transform; }
  @keyframes spin { to { transform: rotate(360deg); } }

  :root { --rx-ground: #0d0e15; --rx-ink: #f4f3f8; --rx-soft: rgba(244, 243, 248, 0.8); --rx-line: rgba(244, 243, 248, 0.16); --rx-cap: rgba(244, 243, 248, 0.1); --rx-ease: cubic-bezier(0.16, 1, 0.3, 1); color-scheme: dark; }
  html, body { background: var(--rx-ground); color: var(--rx-ink); font-family: 'Familjen Grotesk', system-ui, sans-serif; }
  #overlay { display: block; background: var(--rx-ground); overflow: hidden; }
  #overlay .rx-frame { position: absolute; inset: 0; background: radial-gradient(110% 80% at 50% 42%, #1c1f2e 0%, var(--rx-ground) 72%); }
  #overlay .rx-art { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 450ms var(--rx-ease); }
  #overlay.rx-has-art .rx-frame { inset: auto; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9; background: #000; }
  #overlay.rx-has-art .rx-art { opacity: 1; }
  #overlay:has(.rx-clear) .rx-frame::after { display: none; }
  #overlay.rx-has-art .rx-frame::after { content: ''; position: absolute; inset: auto 0 0 0; height: 36%; background: linear-gradient(to top, rgb(13 14 21 / 0.92), rgb(13 14 21 / 0.66) 45%, transparent); }
  #overlay .card { position: absolute; left: 50%; top: 50%; bottom: auto; transform: translate(-50%, -50%); width: min(760px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow: auto; margin: 0; padding: 0; text-align: center; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 14px 12px; z-index: 1; background: none; border: 0; box-shadow: none; font-size: 17px; line-height: 1.5; }
  #overlay.rx-has-art .card { top: auto; transform: translateX(-50%); bottom: calc((100vh - min(100vh, 100vw * 9 / 16)) / 2 + clamp(20px, 3.2vw, 40px)); }
  #overlay .card > * { margin: 0; }
  #overlay .card h1 { order: 0; flex-basis: 100%; font: 650 clamp(44px, 6.6vw, 104px)/0.98 'Familjen Grotesk', system-ui, sans-serif; letter-spacing: -0.03em; text-wrap: balance; margin-bottom: clamp(12px, 3vh, 32px); color: var(--rx-ink); }
  #overlay.rx-has-art .card h1 { position: absolute; width: 1px; height: 1px; margin: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #overlay .card p { flex-basis: 100%; color: var(--rx-soft); font-size: 17px; }
  #overlay #status, #overlay #rx-status { order: 1; flex-basis: 100%; min-height: 0; margin: 0; color: var(--rx-soft); font-size: 17px; font-variant-numeric: tabular-nums; }
  #overlay #status:empty, #overlay #rx-status:empty { display: none; }
  #overlay .start-row { order: 3; display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
  #overlay #play { order: 3; min-width: 176px; height: 56px; padding: 0 28px; border: 0; border-radius: 14px; background: var(--rx-ink); color: #14141c; font: 650 18px/1 'Familjen Grotesk', system-ui, sans-serif; letter-spacing: 0.005em; box-shadow: 0 8px 28px rgb(0 0 0 / 0.35); cursor: pointer; transition: transform 160ms var(--rx-ease), box-shadow 160ms var(--rx-ease); }
  #overlay #play:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 12px 32px rgb(0 0 0 / 0.42); }

  document.addEventListener('pointerlockchange', () => { $('bmouse').textContent = document.pointerLockElement === canvas ? 'Mouse: captured' : 'Mouse: free'; });
  const PACE = { cap: ['60 fps', 'cap'], vsync: ['Vsync', 'auto'], off: ['Uncapped', 'mc'] }, PACE_ORDER = ['cap', 'vsync', 'off'];
  let pace = PACE[q.get('pace')] ? q.get('pace') : PACE[localStorage.getItem('rxcPace')] ? localStorage.getItem('rxcPace') : 'cap';
  const setPace = p => { pace = p; if (window.rexcomp) window.rexcomp.yieldMode = PACE[p][1]; localStorage.setItem('rxcPace', p); $('bvsync').textContent = 'Frame rate: ' + PACE[p][0]; };
  $('bvsync').onclick = () => setPace(PACE_ORDER[(PACE_ORDER.indexOf(pace) + 1) % PACE_ORDER.length]);
  setPace(pace);
  // HUD buttons must never keep keyboard focus: Enter/Space would "click" them instead of reaching the game
  for (const b of document.querySelectorAll('#hud button')) { b.tabIndex = -1; b.addEventListener('mousedown', e => e.preventDefault()); b.addEventListener('click', () => { b.blur(); canvas.focus(); }); }
  setInterval(() => { const s = globalThis.__rxcStats; if (s) $('fps').textContent = `${s.fps.toFixed(0)} fps`; }, 500);

  // ---- input -> guest window messages
  const ev = (name, ...a) => { if (M && M['_' + name]) M['_' + name](...a); };
  const locked = () => document.pointerLockElement === canvas;
  const pos = e => { const r = canvas.getBoundingClientRect(), cw = (M && M.canvasW) || canvas.width, ch = (M && M.canvasH) || canvas.height; return [Math.round((e.clientX - r.left) * cw / r.width), Math.round((e.clientY - r.top) * ch / r.height)]; };
  let mouseX = 0, mouseY = 0;
  const cursor = $('locked-cursor');
  const mousePosition = e => {
    if (!locked()) return pos(e);
    if (!autoCapture) return [-1, -1];
    const r = canvas.getBoundingClientRect();
    return pos({ clientX: r.left + mouseX, clientY: r.top + mouseY });
  };
  const showCursor = () => {
    cursor.hidden = !autoCapture || !locked() || !$('overlay').classList.contains('hidden');
    const r = canvas.getBoundingClientRect();
    cursor.style.left = `${r.left + mouseX}px`;
    cursor.style.top = `${r.top + mouseY}px`;
  };
  document.addEventListener('pointerlockchange', showCursor);
  addEventListener('keydown', e => {
    if (!started) return;
    if (e.code === 'F9') { toggle($('log')); e.preventDefault(); return; }
    if (e.code === 'F8') { $('bfps').onclick(); e.preventDefault(); return; }
    if (e.code === 'F11') { $('bfull').onclick(); e.preventDefault(); return; }
    if (e.code === 'F10') { $('bmouse').onclick(); e.preventDefault(); return; }
    const k = K[e.code]; if (!k) return;
    ev('rxc_ev_key', 1, k[0], k[1], (e.repeat ? 1 : 0) | (k[2] ? 2 : 0));
    if (e.key.length === 1 && !e.ctrlKey && !e.altKey) ev('rxc_ev_char', e.key.charCodeAt(0));
    else if (e.code === 'Enter' || e.code === 'Backspace' || e.code === 'Tab' || e.code === 'Escape') ev('rxc_ev_char', k[0]);
    e.preventDefault();
  });
  addEventListener('keyup', e => { if (!started) return; const k = K[e.code]; if (!k) return; ev('rxc_ev_key', 0, k[0], k[1], k[2] ? 2 : 0); e.preventDefault(); });
  canvas.addEventListener('mousemove', e => {
    if (locked()) {
      if (autoCapture) {
        const r = canvas.getBoundingClientRect();
        mouseX = Math.max(0, Math.min(r.width - 1, mouseX + e.movementX));
        mouseY = Math.max(0, Math.min(r.height - 1, mouseY + e.movementY));
        ev('rxc_ev_mouse', 4, ...pos({ clientX: r.left + mouseX, clientY: r.top + mouseY }), 0, 0);
        showCursor();
      }
      if ((e.movementX || e.movementY) && (!autoCapture || M?._rxc_raw_mouse_wanted?.())) ev('rxc_ev_mouse_raw', e.movementX, e.movementY);
    }
    else {
      const [x, y] = pos(e); ev('rxc_ev_mouse', 0, x, y, 0, 0);
      // Windows raw input reports mouse deltas whether or not the cursor is locked: games that read the mouse through
      // WM_INPUT get them as well as the absolute position
      if ((e.movementX || e.movementY) && M && M._rxc_raw_mouse_wanted && M._rxc_raw_mouse_wanted()) ev('rxc_ev_mouse_raw', e.movementX, e.movementY);
    }
  });
  canvas.addEventListener('click', e => {
    if (autoCapture && started && !locked()) {
      const r = canvas.getBoundingClientRect();
      mouseX = e.clientX - r.left; mouseY = e.clientY - r.top;
      grab();
    }
  });
  canvas.addEventListener('mousedown', e => {
    canvas.focus();
    const [x, y] = mousePosition(e); ev('rxc_ev_mouse', 1, x, y, e.button, 0); e.preventDefault();
  });
  addEventListener('mouseup', e => { if (!started) return; const [x, y] = mousePosition(e); ev('rxc_ev_mouse', 2, x, y, e.button, 0); });
  canvas.addEventListener('wheel', e => { ev('rxc_ev_mouse', 3, -1, -1, 0, -Math.sign(e.deltaY) * 120); e.preventDefault(); }, { passive: false });
  canvas.addEventListener('contextmenu', e => e.preventDefault());
  addEventListener('focus', () => ev('rxc_ev_focus', 1)); addEventListener('blur', () => ev('rxc_ev_focus', 0));
  view.addEventListener('webglcontextlost', e => { window.__rxcLost = true; status('The graphics context was lost (GPU reset). Reload the page to continue.'); startupError(); });
  document.addEventListener('pointerlockchange', () => $('hint').classList.toggle('show', started && !locked()));

  // ---- audio: an AudioWorklet playing the PCM the game's audio device produces (rt/win32/wasapi.c). A small jitter
  // buffer: playback starts with 80 ms queued and increases that target after an underrun, so late delivery plays in longer pieces instead of
  // crackling; a gap decays to silence and the stream fades back in (no clicks); a backlog over 350 ms (the game ran
  // ahead of the device) skips to 150 ms. Every second it reports underruns ({a: stats}: frames of silence, gaps,
  // frames dropped, queue low/high in frames) - globalThis.__rxcAudio, read by tools/mc2bench.py.
  const WORKLET = `class RexcompOut extends AudioWorkletProcessor {
    constructor() { super(); this.q = []; this.off = 0; this.queued = 0; this.play = false; this.began = false; this.gain = 1; this.l = 0; this.r = 0; this.k = 0;
      this.target = sampleRate * 0.08;
      this.st = { starve: 0, gaps: 0, drop: 0, qmin: 1e9, qmax: 0 };
      this.port.onmessage = e => { if (e.data && e.data.reset) { this.q = []; this.off = this.queued = 0; this.play = this.began = false; this.target = sampleRate * 0.08; this.gain = 0; this.l = this.r = 0; return; }
        this.q.push(e.data); this.queued += e.data.length / 2;
        if (this.queued > sampleRate * 0.35) { while (this.q.length > 1) { const f = this.q[0].length / 2 - this.off; if (this.queued - f < Math.max(sampleRate * 0.15, this.target)) break; this.q.shift(); this.queued -= f; this.st.drop += f; this.off = 0; } this.gain = 0; } }; }
    process(inputs, outputs) { const out = outputs[0], L = out[0], R = out[1] || out[0], n = L.length; let i = 0;
      if (!this.play && this.queued >= this.target) { this.play = true; this.began = true; this.gain = 0; }
      if (this.play) {
        while (i < n && this.q.length) { const b = this.q[0], frames = b.length / 2, take = Math.min(n - i, frames - this.off);
          for (let k = 0; k < take; k++) { const g = this.gain; L[i + k] = b[(this.off + k) * 2] * g; R[i + k] = b[(this.off + k) * 2 + 1] * g; if (g < 1) this.gain = Math.min(1, g + 1 / 128); }
          i += take; this.off += take; this.queued -= take; if (this.off >= frames) { this.q.shift(); this.off = 0; } }
        if (i) { this.l = L[i - 1]; this.r = R[i - 1]; }
        if (i < n) { this.play = false; this.target = Math.min(sampleRate * 0.24, this.target + sampleRate * 0.04); this.st.gaps++; }
      }
      if (i < n && this.began) this.st.starve += n - i;
      for (; i < n; i++) { this.l *= 0.9; this.r *= 0.9; L[i] = this.l; R[i] = this.r; }
      if (this.queued < this.st.qmin) this.st.qmin = this.queued; if (this.queued > this.st.qmax) this.st.qmax = this.queued;
      if (++this.k % 375 === 0) { this.st.targetMs = this.target * 1000 / sampleRate; this.port.postMessage({ a: this.st }); this.st = { starve: 0, gaps: 0, drop: 0, qmin: 1e9, qmax: 0 }; }
      return true; } }
  registerProcessor('rexcomp-out', RexcompOut);`;
  async function startAudio(M) {
    try {
      const ctx = new AudioContext({ sampleRate: 48000, latencyHint: 'interactive' });
      M.audioContext = ctx; M.soundOn = true;
      const soundLabel = () => { $('bsound').textContent = !M.soundOn ? 'Sound: off' : ctx.state === 'running' ? 'Sound: on' : 'Sound: click to enable'; };
      ctx.onstatechange = soundLabel; soundLabel();
      ctx.resume().catch(() => soundLabel());
      const ensureAudio = () => { if (M.soundOn && ctx.state !== 'running') ctx.resume().catch(soundLabel); };
      document.addEventListener('visibilitychange', () => { if (!document.hidden) ensureAudio(); });
      addEventListener('focus', ensureAudio);
      addEventListener('pointerdown', ensureAudio, true);
      addEventListener('keydown', ensureAudio, true);
      await ctx.audioWorklet.addModule('data:text/javascript,' + encodeURIComponent(WORKLET));
      const node = new AudioWorkletNode(ctx, 'rexcomp-out', { numberOfInputs: 0, outputChannelCount: [2] });
      node.connect(ctx.destination); M.audioNode = node;
      const an = ctx.createAnalyser(); an.fftSize = 2048; node.connect(an);
      window.rxcAudioLevel = async ms => {
        const buf = new Float32Array(an.fftSize), end = performance.now() + (ms || 3000); let n = 0, sum = 0, peak = 0, loud = 0, polls = 0;
        while (performance.now() < end) { an.getFloatTimeDomainData(buf); let s = 0; for (const v of buf) { s += v * v; if (Math.abs(v) > peak) peak = Math.abs(v); } sum += s; n += buf.length; polls++; if (Math.sqrt(s / buf.length) > 0.001) loud++; await new Promise(r => setTimeout(r, 40)); }
        return { state: ctx.state, rms: Math.sqrt(sum / Math.max(1, n)), peak, audibleFraction: loud / Math.max(1, polls), destinationChannels: ctx.destination.channelCount };
      };
      // underrun totals since the last read (tools/mc2bench.py reads and resets them)
      node.port.onmessage = e => { const a = e.data.a, t = globalThis.__rxcAudio || (globalThis.__rxcAudio = { starve: 0, gaps: 0, drop: 0, qmin: 1e9, qmax: 0 });
        t.starve += a.starve; t.gaps += a.gaps; t.drop += a.drop; t.qmin = Math.min(t.qmin, a.qmin); t.qmax = Math.max(t.qmax, a.qmax); t.targetMs = a.targetMs; };
      $('bsound').onclick = () => { M.soundOn = !M.soundOn || ctx.state !== 'running'; (M.soundOn ? ctx.resume() : ctx.suspend()).catch(() => {}).finally(soundLabel); soundLabel(); };
    } catch (e) { console.warn('[audio] unavailable:', e); $('bsound').textContent = 'Sound: n/a'; }
  }

  // ---- debug: window.rxcDump(glTexture, w, h, isFloat, name) reads a render target back from the graphics worker and POSTs it
  // as a PNG to the dev server (tools/serve_web.py -> build/<name>/shots/<name>.png). Texture ids come from the pass log
  // (window.rexcomp.gfxWorker.postMessage({passlog: 1}), lines "-> rt texN").
  window.rxcProfile = async (ms, name) => {
    const P = new Profiler({ sampleInterval: 1, maxBufferSize: 200000 });
    await new Promise(r => setTimeout(r, ms || 5000));
    const t = await P.stop(), self = new Map(), incl = new Map(), fname = i => { const f = t.frames[i]; return f ? (f.name || '?') + (f.resourceId !== undefined && !f.name ? '@' + f.line : '') : '?'; };
    let n = 0;
    for (const s of t.samples) {
      if (s.stackId === undefined) continue; n++;
      let st = t.stacks[s.stackId]; const top = fname(st.frameId); self.set(top, (self.get(top) || 0) + 1);
      const seen = new Set(); while (st) { const nm = fname(st.frameId); if (!seen.has(nm)) { seen.add(nm); incl.set(nm, (incl.get(nm) || 0) + 1); } st = st.parentId !== undefined ? t.stacks[st.parentId] : null; }
    }
    const top = (m, k) => [...m.entries()].sort((a, b) => b[1] - a[1]).slice(0, k).map(([f, c]) => `${(100 * c / n).toFixed(1)}% ${f}`);
    const out = { samples: n, self: top(self, 80), inclusive: top(incl, 120) };
    await fetch('/upload/' + (name || 'profile') + '.json', { method: 'POST', body: JSON.stringify(out, null, 1) });
    return n;
  };
  window.rxcDump = (tex, w, h, fl, name) => window.rexcomp.gfxWorker.postMessage({ readtex: [tex, w, h, fl ? 1 : 0, name || ('tex' + tex)] });
  function rxcImage(im) {
    const c = new OffscreenCanvas(im.w, im.h); c.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(im.data.buffer), im.w, im.h), 0, 0);
    c.convertToBlob({ type: 'image/png' }).then(b => fetch('/upload/' + im.name + '.png', { method: 'POST', body: b })).then(() => console.log('[dump] uploaded ' + im.name));
  }

  const PROG_KEY = 'rxcPrograms';
  const loadLearned = () => { try { const a = JSON.parse(localStorage.getItem(PROG_KEY) || '[]'); return Array.isArray(a) ? a : []; } catch (e) { return []; } };
  const saveLearned = () => {
    const cur = globalThis.__rxcPrograms; if (!cur || !cur.length) return;
    try { const all = new Set(loadLearned()); for (const k of cur) all.add(k); localStorage.setItem(PROG_KEY, JSON.stringify([...all].slice(-8000))); } catch (e) {}
  };

  // ---- start
  const bar = $('bar').firstElementChild;

  $('play').onclick = async () => {
    if (started) return; started = true;
    if (autoCapture && navigator.userActivation?.isActive) {
      const r = canvas.getBoundingClientRect();
      mouseX = r.width / 2; mouseY = r.height / 2;
      grab();
    }
    startupLogStart = performance.now(); startupLogActive = true;
    $('play').disabled = true;
    $('overlay').classList.remove('startup-error');
    status('Preparing download…');
    bar.parentElement.classList.add('indeterminate');
    const clock = $('elapsed');
    const showElapsed = () => {
      const seconds = Math.floor((performance.now() - startupLogStart) / 1000);
      clock.textContent = 'Elapsed ' + Math.floor(seconds / 60) + ':' + String(seconds % 60).padStart(2, '0');
    };
    showElapsed();
    const timer = setInterval(showElapsed, 1000);
    try {
      await rxcDownloadGame(q.get('base') || GAME_BASE, (loaded, total) => {
        const percent = total ? Math.floor(100 * loaded / total) : 100;
        bar.parentElement.classList.remove('indeterminate');
        bar.style.width = percent + '%';
        $('status').textContent = 'Downloading ' + percent + '% · ' + Math.round(loaded / 1048576) + ' / ' + Math.round(total / 1048576) + ' MiB';
      });
    } catch (error) {
      startupError();
      status('Download failed. ' + error.message);
      $('play').textContent = 'Retry';
      $('play').disabled = false;
      started = false;
      return;
    } finally {
      clearInterval(timer);
      showElapsed();
    }
    status('Download complete · Starting game…');
    M = {
      canvas: view, arguments: [launchArgs()], yieldMode: PACE[pace][1], fpsCap: +(q.get('fps') || 60),
      // ?mt=N: N guest threads get a host thread of their own (0 = the threaded module, still cooperative)
      gameBase: q.get('base') || GAME_BASE,
      dynamicLibraries: window.REXCOMP_SIDE_MODULES || [],
      preRun: [m => { m.ENV.REXCOMP_MT = q.get('mt') || '0'; m.ENV.REXCOMP_SCREEN = res.join('x'); Object.assign(m.ENV, PORT_ENV); for (const k in env) m.ENV[k] = env[k]; }],   // debug switches, e.g. ?REXCOMP_INPUT=...
      print: s => { console.log(s); if (globalThis.__rxcSink) globalThis.__rxcSink.push(s); },
      printErr: s => { console.error(s); if (globalThis.__rxcSink) globalThis.__rxcSink.push(s); },
      onFirstFrame: () => { flushStartupLog(); startupLogActive = false; bar.parentElement.classList.remove('indeterminate'); bar.style.width = '100%'; $('overlay').classList.add('hidden'); showCursor(); $('hint').classList.add('show'); setTimeout(() => $('hint').classList.remove('show'), 5000); canvas.focus(); },
    };
    const useWorker = q.get('gfxworker') !== '0' && !!view.transferControlToOffscreen;
    window.rexcomp = M;
    // graphics on a worker thread: the canvas is handed to rt/gfxworker (OffscreenCanvas) and the engine thread only
    // records commands (rt/web/gfx_remote.c). ?gfxworker=0 keeps WebGL on the engine thread.
    if (useWorker) {
      try {
        const w = await rxcMakeGfxWorker(), off = view.transferControlToOffscreen(), wenv = {};
        for (const k in env) if (!['REXCOMP_INPUT', 'REXCOMP_EXIT_AT', 'REXCOMP_SHOT'].includes(k)) wenv[k] = env[k];
        M.__gfxEarly = [];
        w.onmessage = e => { if (e.data.img) return rxcImage(e.data.img); M.__gfxmsg ? M.__gfxmsg(e.data) : M.__gfxEarly.push(e.data); };
        w.onerror = e => { console.error('[gfx worker] ' + (e.message || e)); status('The graphics worker failed to start: ' + (e.message || e)); };
        const noprelink = M.prelinkShaders === false || q.has('noprelink');
        w.postMessage({ init: true, canvas: off, env: wenv, noprelink, learned: noprelink ? [] : loadLearned() }, [off]);
        setInterval(saveLearned, 15000); addEventListener('pagehide', saveLearned);
        M.gfxWorker = w;
      } catch (e) { console.warn('[web] graphics worker unavailable, WebGL stays on the engine thread:', e); }
    }
    // the engine loads levels synchronously (no frames for many seconds): show a spinner whenever frames stop for 1.5 s
    setInterval(() => { const t = M.__lastPresent; $('busy').classList.toggle('show', !!t && performance.now() - t > 1500); }, 250);
    if (q.has('logsink')) {
      globalThis.__rxcSink = [];
      fetch('/log?start=1', { method: 'POST', body: '' });
      setInterval(() => { const b = globalThis.__rxcSink; if (!b.length) return; globalThis.__rxcSink = []; fetch('/log', { method: 'POST', body: b.join('\n') + '\n' }); }, 1000);
      let dumped = 0;
      setInterval(() => { const t = M.__lastPresent; if (t && performance.now() - t > 12000 && performance.now() - dumped > 60000 && M._rxc_dbg_thrdump) { dumped = performance.now(); M._rxc_dbg_thrdump(); } }, 2000);
    }
    await startAudio(M);                   // inside the click: user activation lets the AudioContext start
    Promise.resolve().then(() => Rexcomp(M)).catch(e => {
      startupError();
      let what = String(e);
      if (e instanceof WebAssembly.Exception && M.getExceptionMessage) { try { what = 'C++ exception ' + M.getExceptionMessage(e).filter(Boolean).join(': '); } catch (_) {} }
      status('Failed to start: ' + what); console.error('[rexcomp] ' + what + (e && e.stack ? '\n' + e.stack : ''));
      if (globalThis.__rxcSink) globalThis.__rxcSink.push('[web] main thread crashed: ' + (e && e.stack ? e.stack : e));
    });
    // the page stays interactive while main() runs on its own JSPI stack; clicking the canvas captures the mouse
    canvas.focus();
  };
  if ('Suspending' in WebAssembly && (q.has('autostart') || document.documentElement.classList.contains('rxc-direct'))) $('play').onclick();
})();
</script>
</body></html>
