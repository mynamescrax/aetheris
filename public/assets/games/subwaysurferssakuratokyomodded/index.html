<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="poki-sdk.js"></script>
    
    <meta http-equiv="content-type" content="text/html; charset=UTF8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="viewport" content="height=device-height, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, minimal-ui, viewport-fit=cover" />
    <meta name="description" content="">
    
    <link rel="manifest" href="subwaysurfers.webmanifest">
    <link rel="icon" href="assets/images/app-icon-16.png" type="image/png">
    <link rel="apple-touch-icon-precomposed" sizes="114x114" href="assets/images/app-icon-114.png">
    <link rel="apple-touch-icon-precomposed" sizes="72x72" href="assets/images/app-icon-72.png">
    <link rel="apple-touch-icon-precomposed" sizes="57x57" href="assets/images/app-icon-57.png">
    <link rel="apple-touch-icon-precomposed" href="assets/images/app-icon-57.png">

    <title>Subway Surfers Web</title>
    <style>
        body, html { 
            margin: 0;
            height: 100%;
            background-color: #0b316b;
            overflow: hidden;
            background-image: url('assets/preload/splash.png');
            background-repeat: no-repeat;
            background-position: center;
        }

        #message {
            text-align: center;
            font-size: 8px;
            z-index: 5;
            font-family: "Verdana", sans-serif;
            color: #fff;
            position: fixed;
            width: 100%;
            z-index: 9999;
        }

        .dot {
            display: inline;
            margin-left: 0.2em;
            margin-right: 0.2em;
            position: relative;
            top: -1em;
            font-size: 3.5em;
            opacity: 0;
            animation: showHideDot 2.5s ease-in-out infinite;
        }

        .dot.one { animation-delay: 0.2s; }
        .dot.two { animation-delay: 0.4s; }
        .dot.three { animation-delay: 0.6s; }

        @keyframes showHideDot {
            0% { opacity: 0; }
            50% { opacity: 1; }
            60% { opacity: 1; }
            100% { opacity: 0; }
        }
        
        /* Toast notification style for settings update */
        #toast-notification {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85);
            color: #ffd966;
            font-family: 'Verdana', sans-serif;
            font-size: 12px;
            padding: 8px 18px;
            border-radius: 30px;
            z-index: 10000;
            pointer-events: none;
            backdrop-filter: blur(4px);
            border: 1px solid #ffcc33;
            box-shadow: 0 2px 12px rgba(0,0,0,0.3);
            font-weight: bold;
            letter-spacing: 0.5px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
    </style>
</head>
<body>
    <div id="toast-notification"></div>
    <script>
        // -----------------------------
        // GAME SETTINGS INJECTOR SCRIPT
        // Only patches the currencies field in GameSettings, leaving everything else intact
        // -----------------------------
        (function() {
            function showToast(msg, isError) {
                var t = document.getElementById('toast-notification');
                if (!t) return;
                t.textContent = msg;
                t.style.color = isError ? '#ff6b6b' : '#ffd966';
                t.style.opacity = '1';
                setTimeout(function() { t.style.opacity = '0'; }, 3000);
            }

            try {
                if (typeof localStorage === 'undefined') {
                    console.warn('localStorage not available on this browser');
                    showToast('⚠️ localStorage unavailable - settings not saved', true);
                } else {
                    var raw = localStorage.getItem('GameSettings') || localStorage.getItem('gameSettings');
                    var settings = raw ? JSON.parse(raw) : {};

                    // Only patch currencies, leave everything else untouched
                    settings.currencies = {
                        "coins": 9999999999999,
                        "keys": 9999999999999
                    };

                    var updated = JSON.stringify(settings);

                    // Write back under whichever key(s) exist
                    if (localStorage.getItem('GameSettings') !== null) {
                        localStorage.setItem('GameSettings', updated);
                    }
                    if (localStorage.getItem('gameSettings') !== null) {
                        localStorage.setItem('gameSettings', updated);
                    }
                    // If neither key existed yet, create the canonical one
                    if (localStorage.getItem('GameSettings') === null && localStorage.getItem('gameSettings') === null) {
                        localStorage.setItem('GameSettings', updated);
                    }

                    console.log('[Injector] SUCCESS: currencies patched to coins=9999999999999, keys=9999999999999');
                }
            } catch (err) {
                console.error('[Injector] Failed to patch currencies in GameSettings:', err);
                showToast('❌ Error patching currencies: ' + err.message, true);
            }
        })();
    </script>
    
    <div id="message">
        <h1>Loading</h1>
        <h1 class="dot one">.</h1><h1 class="dot two">.</h1><h1 class="dot three">.</h1>
    </div>
    
    <!-- preserve original game scripts but ensure our injection runs first and doesn't interfere -->
    <script src="js/loading.js"></script>
    <!-- Versioned so the bundle-path fix is not hidden by the week-long
         /assets/games cache on the unversioned js/index.js. -->
    <script>window.MAIN = './js/index.js?v=20261107.1';</script>
    <script src="js/boot.js"></script>
    
    <!-- ensure window.GAME_CONFIG remains intact, plus additional injection verification after load -->
    <script>
        (function verifyAndProtect() {
            if (localStorage && localStorage.getItem('GameSettings')) {
                try {
                    var parsed = JSON.parse(localStorage.getItem('GameSettings'));
                    if (parsed.currencies && parsed.currencies.coins === 9999999999999) {
                        console.log("[Injector] Confirmation: currencies patch still active after boot.");
                    } else {
                        console.log("[Injector] Attention: currencies may have been altered by game after boot.");
                    }
                } catch(e) {}
            }
        })();
    </script>
</body>
</html>
