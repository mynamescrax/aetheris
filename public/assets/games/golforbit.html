<!DOCTYPE html>
<html lang="en-us">
    <head>
        <base href="https://cdn.jsdelivr.net/gh/mynamescrax/gamesforaetheris@main/golforbit/">
        <meta charset="utf-8">
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
        <title>Golf Orbit</title>
        <style>
            html, body {
                width: 100%;
                height: 100%;
                padding: 0px;
                margin: 0px;
            }
            .fullscreen-canvas {
                background: #242424;
                width: 100%;
                height: 100%;
                position: absolute;
                top: 0px;
                left: 0px;
            }
        </style>
    </head>
    <body>
        <div id="popup-overlay" style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);display:flex;justify-content:center;align-items:center;z-index:9999;">
            <span style="color:#fff;font-family:Arial,sans-serif;font-size:36px;">aetheris.win</span>
        </div>
        <canvas id="canvas" class="fullscreen-canvas"></canvas>
        <script>
            (function() {
                var cdnBase = 'https://cdn.jsdelivr.net/gh/mynamescrax/gamesforaetheris@main/golforbit/';
                var originalFetch = window.fetch;
                window.fetch = function(url, options) {
                    var redirected = false;
                    if (typeof url === 'string' && !url.startsWith(cdnBase) && !url.startsWith('blob:') && !url.startsWith('data:')) {
                        if (!url.startsWith('http') && !url.startsWith('//')) {
                            url = cdnBase + url;
                            redirected = true;
                        } else {
                            try {
                                var parsed = new URL(url);
                                if (parsed.origin === window.location.origin) {
                                    var path = parsed.pathname;
                                    var markers = ['StreamingAssets/', 'Build/'];
                                    for (var i = 0; i < markers.length; i++) {
                                        var idx = path.indexOf(markers[i]);
                                        if (idx !== -1) {
                                            url = cdnBase + path.substring(idx);
                                            redirected = true;
                                            break;
                                        }
                                    }
                                }
                            } catch(e) {}
                        }
                    }
                    if (redirected || (typeof url === 'string' && url.startsWith(cdnBase))) {
                        options = options ? Object.assign({}, options) : {};
                        delete options.headers;
                    }
                    return originalFetch.call(this, url, options);
                };
            })();

            window.fileMergerConfig = {
                files: [
                    { name: 'b6fe6e288fefbe64909957135ac312a1.wasm.unityweb', parts: 4 },
                ],
                basePath: 'Build/',
                debug: true
            };
        </script>
        <script src="https://cdn.jsdelivr.net/gh/bubbls/UGS-Assets@ac5cdfc0042aca584e72619375b4aca948a9243c/merge.js"></script>
        <script src="./playgama-bridge-unity.js"></script>
        <script>
            setTimeout(function() { document.getElementById('popup-overlay').remove(); }, 1500);
        </script>
    </body>
</html>
