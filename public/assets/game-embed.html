<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Game preview</title>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
      iframe { width: 100%; height: 100%; border: 0; display: block; }
    </style>
  </head>
  <body>
    <script>
      // Scramjet resolves this virtual origin to the original local HTML.
      var game = new URLSearchParams(location.search).get("game");
      if (game && /^\/assets\/games\/[^?#]+\.html(?:\?[^#]*)?$/.test(game)) {
        var frame = document.createElement("iframe");
        frame.title = "Game";
        frame.allow = "autoplay; fullscreen; gamepad";
        frame.allowFullscreen = true;
        frame.src = "https://aetheris-games.invalid" + game;
        document.body.appendChild(frame);
      } else {
        document.body.textContent = "Invalid local game.";
      }
    </script>
  </body>
</html>
