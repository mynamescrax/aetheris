    <script>
      (function () {
        var title = Aetheris.storage.getItem("tabName");
        var icon = Aetheris.storage.getItem("tabIcon");
        if (title) document.title = title;
        if (icon) {
          var link = document.querySelector('link[rel*="icon"]');
          if (!link) {
            link = document.createElement("link");
            link.rel = "icon";
            document.head.appendChild(link);
          }
          link.href = icon;
        }

        if (Aetheris.storage.getItem("performanceMode") === "true") {
          document.documentElement.classList.add("power-saving");
        }
        if (navigator.deviceMemory && navigator.deviceMemory <= 2) {
          document.documentElement.classList.add("power-saving");
        }
      })();

      (function () {
        var THEME_KEY = "aetheris-theme";
        var validthemes = { dark: 1, "charcoal-gold": 1, "dark-blue": 1 };

        if (
          !Aetheris.storage.getItem(THEME_KEY) &&
          Aetheris.storage.getItem("theme")
        ) {
          Aetheris.storage.setItem(
            THEME_KEY,
            Aetheris.storage.getItem("theme"),
          );
          Aetheris.storage.removeItem("theme");
        }
        var t = Aetheris.storage.getItem(THEME_KEY) || "dark";
        if (t === "dark blue") {
          t = "dark-blue";
          Aetheris.storage.setItem(THEME_KEY, t);
        }
        if (t === "charcoal gold") {
          t = "charcoal-gold";
          Aetheris.storage.setItem(THEME_KEY, t);
        }
        if (!validthemes[t]) {
          t = "dark";
          Aetheris.storage.setItem(THEME_KEY, t);
        }

        document.documentElement.setAttribute("theme", t);
        document.addEventListener(
          "DOMContentLoaded",
          function () {
            document.body.setAttribute("theme", t);
          },
          { once: true },
        );

        function applythemeearly(theme) {
          document.documentElement.setAttribute("theme", theme);
          if (document.body) document.body.setAttribute("theme", theme);
        }

        window.addEventListener("message", function (e) {
          if (e.origin !== location.origin) return;
          var mf = document.getElementById("mainframe");
          if (mf && e.source !== mf.contentWindow) return;
          if (
            e.data &&
            e.data.type === "theme-changed" &&
            e.data.theme &&
            validthemes[e.data.theme]
          ) {
            Aetheris.storage.setItem(THEME_KEY, e.data.theme);
            applythemeearly(e.data.theme);
          }
        });
      })();
    </script>

    <script>
      // Pre-warm the proxy controller so it's ready by the time the player
      // opens a game (cheats.html/search.html/load.js each get their own
      // Controller instance — this one just eats the cold-start cost early
      // and shows a toast).
      document.addEventListener(
        "DOMContentLoaded",
        function earlyinit() {
          if (!window.aetherisProxy) {
            console.warn(
              "[init] aetherisProxy helper not loaded yet, skipping pre-warm",
            );
            return;
          }

          window.aetherisProxy
            .getController()
            .then(function () {
              var t = document.getElementById("sj-toast");
              if (t) {
                t.classList.add("show");
                setTimeout(function () {
                  t.classList.remove("show");
                }, 3000);
              }
            })
            .catch(function (err) {
              console.error("[init] Scramjet pre-warm failed:", err);
            });
        },
        { once: true },
      );
    </script>

    <meta name="theme-color" content="#0f0f0f" />
    <script>
      (function () {
        var themeColors = {
          dark: "#0f0f0f",
          "charcoal-gold": "#0f0f0f",
          "dark-blue": "#020617",
        };
        function updatethemecolor(t) {
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta && themeColors[t]) meta.content = themeColors[t];
        }
        var t =
          document.documentElement.getAttribute("theme") ||
          Aetheris.storage.getItem("aetheris-theme") ||
          "dark";
        updatethemecolor(t);
        window.addEventListener("message", function (e) {
          if (e.origin !== location.origin) return;
          if (e.data && e.data.type === "theme-changed" && e.data.theme)
            updatethemecolor(e.data.theme);
        });
      })();
    </script>

    <script>
      var VALID_THEMES = { dark: 1, "charcoal-gold": 1, "dark-blue": 1 };

      var mainframe = document.getElementById("mainframe");
      var navcheck = document.getElementById("nav-toggle");
      var sidebar = document.getElementById("sidebar");
      var navhandle = document.querySelector(".nav-handle");

      function setSidebar(open, restoreFocus) {
        if (open && document.body.classList.contains("backup-open")) return;
        navcheck.checked = open;
        sidebar.inert = !open;
        document.querySelector(".sitewrap").inert = open;
        document.body.classList.toggle("sidebar-open", open);
        navhandle.setAttribute("aria-expanded", String(open));
        if (open) sidebar.querySelector(".sidebar-edge").focus();
        else if (restoreFocus) navhandle.focus();
      }
      navhandle.addEventListener("click", function () {
        setSidebar(true);
      });
      document
        .querySelector(".sidebar-edge")
        .addEventListener("click", function () {
          setSidebar(false, true);
        });
      document
        .querySelector(".nav-overlay")
        .addEventListener("click", function () {
          setSidebar(false, true);
        });
      document.addEventListener("keydown", function (event) {
        if (!navcheck.checked) return;
        if (event.key === "Escape") {
          event.preventDefault();
          setSidebar(false, true);
        }
        if (event.key !== "Tab") return;
        var controls = Array.from(sidebar.querySelectorAll("a, button"));
        var first = controls[0],
          last = controls[controls.length - 1];
        if (event.shiftKey && document.activeElement === first) {
          event.preventDefault();
          last.focus();
        } else if (!event.shiftKey && document.activeElement === last) {
          event.preventDefault();
          first.focus();
        }
      });

      var pages = {
        home: "home.html",
        games: "maths.html",
        apps: "apps.html",
        cheats: "cheats.html",
        chat: "chat.html",
        ai: "ai.html",
        movies: "movies.html",
        search: "search.html",
        about: "about.html",
        settings: "settings.html",
      };

      var navigationTimer = null;
      var fadeTimer = null;
      var requestedUrl = mainframe.getAttribute("src");
      var navigating = false;
      var navLoading = document.getElementById("nav-loading");

      function showNavLoading() {
        if (navLoading) navLoading.hidden = false;
      }
      function hideNavLoading() {
        if (navLoading) navLoading.hidden = true;
      }

      function updateActiveNav(name) {
        if (name === "load") name = "games";
        document.querySelectorAll(".navitem a").forEach(function (link) {
          var active = link.getAttribute("data-page") === name;
          link.classList.toggle("is-active", active);
          if (active) link.setAttribute("aria-current", "page");
          else link.removeAttribute("aria-current");
        });
      }

      function gopage(value, fromHistory) {
        var route = Aetheris.parseRoute(value) || Aetheris.parseRoute("home");
        if (route.name === "chat") chatbadge(0);
        updateActiveNav(
          route.name === "load" && route.url.includes("app=")
            ? "apps"
            : route.name,
        );
        setSidebar(false);
        document.body.classList.remove("immersive-mode");
        document.body.classList.remove("backup-open");
        if (!fromHistory && location.hash !== "#" + route.route)
          history.pushState(null, "", "#" + route.route);
        if (requestedUrl === route.url) {
          if (!navigating) {
            mainframe.classList.remove("fading");
            hideNavLoading();
          }
          return;
        }
        clearTimeout(navigationTimer);
        clearTimeout(fadeTimer);
        requestedUrl = route.url;
        navigating = true;
        mainframe.classList.add("fading");
        showNavLoading();
        navigationTimer = setTimeout(
          function () {
            navigationTimer = null;
            // Replace the child history entry; the shell owns menu history.
            try {
              mainframe.contentWindow.location.replace(route.url);
            } catch (_) {
              mainframe.src = route.url;
            }
            fadeTimer = setTimeout(function () {
              mainframe.classList.remove("fading");
              hideNavLoading();
            }, 1500);
          },
          matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 100,
        );
      }
      window.navigateApp = gopage;
      window.addEventListener("popstate", function () {
        gopage(location.hash.slice(1), true);
      });
      window.addEventListener("hashchange", function () {
        gopage(location.hash.slice(1), true);
      });
      mainframe.addEventListener("load", function () {
        clearTimeout(fadeTimer);
        mainframe.classList.remove("fading");
        hideNavLoading();
        try {
          var route = Aetheris.routeForUrl(
            mainframe.contentWindow.location.href,
          );
          if (!route) return;
          if (navigating && route.url !== requestedUrl) return;
          navigating = false;
          // A card clicked inside the frame has its own history entry.
          if (navigationTimer !== null) clearTimeout(navigationTimer);
          navigationTimer = null;
          requestedUrl = route.url;
          history.replaceState(null, "", "#" + route.route);
          updateActiveNav(
            route.name === "load" && route.url.includes("app=")
              ? "apps"
              : route.name,
          );
          document.body.classList.remove("immersive-mode");
          document.body.classList.remove("backup-open");
        } catch (_) {}
      });
      gopage(location.hash.slice(1) || "home", true);

      document.querySelectorAll(".navitem a, .logo a").forEach(function (el) {
        el.href = "#" + el.getAttribute("data-page");
        el.addEventListener("click", function (e) {
          e.preventDefault();
          var page = this.getAttribute("data-page");
          if (page) gopage(page);
        });
      });

      function applytheme(theme) {
        var t = theme || Aetheris.storage.getItem("aetheris-theme") || "dark";
        if (!VALID_THEMES[t]) t = "dark";
        document.documentElement.setAttribute("theme", t);
        if (document.body && document.body.getAttribute("theme") !== t) {
          document.body.setAttribute("theme", t);
        }
        if (mainframe && mainframe.contentWindow) {
          try {
            mainframe.contentWindow.postMessage(
              { type: "theme-changed", theme: t },
              location.origin,
            );
          } catch (_) {}
        }
      }
      applytheme();
      window.addEventListener("aetheris-update-ready", function () {
        var toast = document.getElementById("sj-toast");
        document.getElementById("sj-toast-body").textContent =
          "Site update ready. Reload when convenient.";
        toast.classList.add("show");
        setTimeout(function () {
          toast.classList.remove("show");
        }, 6000);
      });

      window.addEventListener("message", function (ev) {
        if (ev.source !== mainframe.contentWindow) return;
        if (ev.origin !== location.origin) return;

        var msg = ev.data || {};

        if (msg.type === "chat-unread") chatbadge(msg.count);
        if (msg.type === "navigate") gopage(msg.page);
        if (msg.type === "immersive-mode")
          document.body.classList.toggle("immersive-mode", msg.active === true);
        if (msg.type === "backup-modal") {
          var backupOpen = msg.active === true;
          document.body.classList.toggle("backup-open", backupOpen);
          navhandle.disabled = backupOpen;
          if (backupOpen) setSidebar(false);
        }
        if (msg.type === "performance-changed")
          document.documentElement.classList.toggle(
            "power-saving",
            msg.enabled === true,
          );
        if (msg.type === "set-tab") {
          document.title = String(msg.name || "Aetheris");
          var favicon = document.querySelector('link[rel*="icon"]');
          var icon = Aetheris.httpUrl(msg.icon || "/assets/images/icon.png");
          if (favicon && icon) favicon.href = icon;
        }

        if (msg.type === "scramjet-status") {
          var toast = document.getElementById("sj-toast");
          document.getElementById("sj-toast-body").textContent = msg.message;
          toast.classList.add("show");
          setTimeout(function () {
            toast.classList.remove("show");
          }, 3000);
        }

        if (
          msg.type === "theme-changed" &&
          msg.theme &&
          VALID_THEMES[msg.theme]
        ) {
          Aetheris.storage.setItem("aetheris-theme", msg.theme);
          applytheme(msg.theme);
        }
      });

      function chatbadge(count) {
        var chatnav = document.querySelector('.navitem a[data-page="chat"]');
        if (!chatnav) return;
        var badge = chatnav.querySelector(".chat-badge");
        if (count > 0) {
          if (!badge) {
            badge = document.createElement("span");
            badge.className = "chat-badge";
            chatnav.appendChild(badge);
          }
          badge.textContent = count > 99 ? "99+" : count;
        } else if (badge) {
          badge.remove();
        }
      }

      (function () {
        function gettoken() {
          var autologin = Aetheris.storage.getItem("dmAutoLogin") !== "false";
          return autologin
            ? Aetheris.storage.getItem("dmToken") ||
                sessionStorage.getItem("dmToken") ||
                ""
            : sessionStorage.getItem("dmToken") || "";
        }

        async function checkunread() {
          var token = gettoken();
          if (!token) {
            chatbadge(0);
            return;
          }
          var active = document.querySelector(".navitem a.is-active");
          if (active && active.getAttribute("data-page") === "chat") return;
          try {
            var r = await fetch("/api/dm-inbox", {
              headers: { Authorization: "Bearer " + token },
            });
            if (!r.ok) return;
            var d = await r.json();
            if (!d.ok) return;
            var total = (d.conversations || []).reduce(function (s, c) {
              return s + (c.unread || 0);
            }, 0);
            chatbadge(total);
          } catch (_) {}
        }

        checkunread();
        setInterval(checkunread, 15000);
      })();

      (function () {
        if (typeof EventSource === "undefined") return;
        var lastcount = null;

        function sendcount(n) {
          try {
            mainframe.contentWindow.postMessage(
              { type: "online-count", count: n },
              location.origin,
            );
          } catch (_) {}
        }

        mainframe.addEventListener("load", function () {
          applytheme();
          if (lastcount !== null) sendcount(lastcount);
        });

        function connect() {
          var es = new EventSource("/online");
          es.onmessage = function (e) {
            var n = parseInt(e.data, 10);
            if (isNaN(n)) return;
            lastcount = n;
            sendcount(n);
          };
          es.onerror = function () {
            es.close();
            setTimeout(connect, 5000);
          };
        }
        connect();
      })();

      (function () {
        var wrap = document.querySelector(".sitewrap");
        if (!wrap) return;
        function resize() {
          var vv = window.visualViewport;
          var h =
            Math.round(vv && vv.scale === 1 ? vv.height : window.innerHeight) +
            "px";
          wrap.style.height = h;
          mainframe.style.height = h;
        }
        window.addEventListener("resize", resize);
        if (window.visualViewport)
          window.visualViewport.addEventListener("resize", resize);
        resize();
      })();

      // panic key — works while focus is on the shell itself; embedded app
      // pages add the same listener via js/preload.js, and game/proxied
      // pages get one injected by the service worker (see sw.js)
      document.addEventListener(
        "keydown",
        function (e) {
          try {
            var key = Aetheris.storage.getItem("panickey");
            if (!key || e.key !== key) return;
            // a single-character panic key would fire on every keystroke
            // while typing in a text field — only let multi-char keys
            // (Escape, F-keys, ...) through in that case
            var t = e.target;
            if (
              e.key.length === 1 &&
              t &&
              (t.tagName === "INPUT" ||
                t.tagName === "TEXTAREA" ||
                t.isContentEditable)
            )
              return;
            e.preventDefault();
            Aetheris.quickExit();
          } catch (_) {}
        },
        true,
      );
    </script>
  </body>
</html>
