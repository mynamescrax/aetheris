<!doctype html>
<html lang="en">
  <head>
    <script src="./js/site.js?v=20261124.1"></script>

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aetheris • Search</title>

    <link
      rel="shortcut icon"
      href="./assets/images/icon.png"
      type="image/png"
    />
    <link rel="stylesheet" href="./css/main.css?v=20261011.2" />
    <link rel="stylesheet" href="./css/cards.css?v=20261115.2" />
    <link rel="stylesheet" href="./css/themes.css?v=20261101.1" />
    <link rel="stylesheet" href="./css/nav.css?v=20261102.1" />

    <script src="./js/theme.js?v=20261101.1"></script>

    <script src="/scramjet/scramjet.js" defer></script>
    <script src="/controller/controller.api.js" defer></script>
    <script src="/js/scramjet-init.js?v=20261108.3"></script>
    <script src="register-sw.js?v=20260907.1" defer></script>
    <script defer src="./js/preload.js?v=20261122.1"></script>

    <script src="./js/open-about-blank.js?v=20261117.2"></script>

    <style>
      #main-container {
        min-height: var(--app-height, 100dvh);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 10px;
        padding: 24px clamp(14px, 3vw, 36px);
      }

      .search-header {
        width: min(100%, 960px);
        text-align: left;
      }

      .search-header h1 {
        font-size: clamp(2.5rem, 8vw, 4rem);
        margin-bottom: 8px;
      }

      .search-header p {
        color: color-mix(in srgb, var(--text-color) 75%, transparent);
        margin-bottom: 22px;
      }

      #sj-form {
        display: flex;
        min-width: 0;
        gap: 6px;
        padding: 6px;
        border: 1px solid color-mix(in srgb, var(--text-color) 22%, transparent);
        border-radius: 16px;
        background: var(--navbar);
      }

      #sj-form:focus-within {
        border-color: var(--accent);
      }

      #sj-address {
        flex: 1;
        min-width: 0;
        width: 100%;
        margin: 0;
        padding: 0 16px;
        text-align: left;
        border: 0;
        outline: 0;
        background: transparent;
        color: var(--text-color);
        font-size: 1.125rem;
      }

      #sj-address:focus {
        box-shadow: none;
      }

      #sj-form button {
        min-width: 84px;
      }

      #main-container:not(.results-open) #sj-form button {
        min-height: 54px;
      }

      #sj-address::placeholder {
        color: color-mix(in srgb, var(--text-color) 68%, transparent);
      }

      #sj-form button,
      #frame-toolbar button {
        min-height: 44px;
        padding: 0 14px;
        border: 1px solid color-mix(in srgb, var(--text-color) 24%, transparent);
        border-radius: 10px;
        background: color-mix(in srgb, var(--text-color) 9%, var(--navbar));
        color: var(--text-color);
        font-weight: 700;
        cursor: pointer;
      }

      #sj-form button:hover,
      #frame-toolbar button:hover {
        border-color: var(--accent);
      }

      #error-area {
        width: min(100%, 960px);
        padding: 12px 16px;
        border: 1px solid #755044;
        border-radius: 10px;
        background: #241b1a;
        text-align: left;
        overflow-wrap: anywhere;
      }

      #error-area:has(#sj-error:empty) {
        display: none;
      }

      #sj-error {
        color: #ffe0cf;
        margin: 0;
        font-size: 0.95rem;
      }

      #search-results {
        width: 100%;
        border-radius: 14px;
        overflow: hidden;
        background: #fff;
        position: relative;
        display: none;
      }

      #search-results iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
      }

      #loading-indicator {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: var(--navbar);
        color: var(--text-color);
        z-index: 2;
      }

      #loading-indicator.hidden {
        display: none;
      }

      #frame-toolbar {
        display: none;
        flex-wrap: wrap;
        gap: 6px;
      }

      #main-container.results-open {
        justify-content: flex-start;
        padding: 10px;
        min-height: 0;
        height: var(--app-height, 100dvh);
      }

      .results-open .search-header {
        width: 100%;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px 16px;
      }

      /* Leave room for the shell's floating sidebar button above the frame. */
      .in-iframe .results-open .search-header {
        padding-left: max(56px, calc(env(safe-area-inset-left) + 45px));
      }

      .results-open .search-header h1,
      .results-open .search-header p {
        display: none;
      }

      .results-open #sj-form {
        flex: 1 1 320px;
      }

      .results-open #frame-toolbar {
        display: flex;
      }

      .results-open #search-results {
        display: block;
        flex: 1;
        min-height: 200px;
      }

      .page-only #main-container {
        padding: 0;
      }

      .page-only .search-header,
      .page-only .results-open .search-header,
      .page-only #loading-indicator {
        display: none;
      }

      .page-only #search-results {
        border-radius: 0;
        min-height: 0;
      }
    </style>
    <link rel="stylesheet" href="./css/usability.css?v=20261115.2" />
  </head>

  <body>
    <main id="main-container">
      <header class="search-header">
        <h1>Web search</h1>
        <p>Search DuckDuckGo or open a website.</p>

        <form id="sj-form">
          <input
            id="sj-search-engine"
            type="hidden"
            value="https://duckduckgo.com/?q=%s"
          />
          <input
            id="sj-address"
            type="text"
            aria-label="Search or enter a URL"
            placeholder="Search or enter a URL"
            autocomplete="off"
            autocapitalize="none"
            spellcheck="false"
            enterkeyhint="go"
          />
          <button type="submit">Search</button>
        </form>

        <div id="frame-toolbar">
          <button
            onclick="toolbarfullscreen()"
            title="Fullscreen"
            aria-label="Fullscreen proxied page"
          >
            Fullscreen
          </button>
          <button
            onclick="openSearchInAboutBlank()"
            title="Open in about:blank"
            aria-label="Open proxied page in about:blank"
          >
            About:blank ↗
          </button>
          <button
            onclick="toolbarrefresh()"
            title="Refresh"
            aria-label="Refresh proxied page"
          >
            Refresh
          </button>
        </div>
      </header>

      <div id="error-area" role="status" aria-live="polite">
        <p id="sj-error"></p>
      </div>

      <div id="search-results">
        <div id="loading-indicator" class="hidden" role="status">Loading…</div>
      </div>
    </main>

    <script>
      var backend = null;
      var currentframe = null;
      var lasturl = null;
      var navigationVersion = 0;
      var loadingTimer = null;

      async function waitforbackend() {
        if (window.aetherisProxy) return;
        // the ?q= auto-search can run before the proxy helper loads, so poll
        await new Promise(function (resolve, reject) {
          var waited = 0;
          var t = setInterval(function () {
            waited += 100;
            if (window.aetherisProxy) {
              clearInterval(t);
              resolve();
            } else if (waited >= 10000) {
              clearInterval(t);
              reject(
                new Error(
                  "backend didn't load. check your connection and retry.",
                ),
              );
            }
          }, 100);
        });
      }

      async function startbackend() {
        // Always ask the shared helper: it caches the controller and returns
        // a fresh one after a reset. Caching here would pin a transport that
        // died while the tab was suspended (iPad Safari) and break retries.
        await waitforbackend();
        backend = await window.aetherisProxy.getController();
        return backend;
      }

      function resolveurl(input) {
        var raw = (input || "").trim();
        if (!raw) return null;

        var hasscheme = /^https?:\/\//i.test(raw);
        // Require a dot with a real TLD (or an IPv4 address) so queries like
        // "3.5mm jack fix" search instead of navigating to https://3.5mm.
        var lookslikeurl =
          /^([a-z0-9-]+\.)+[a-z]{2,}([/:?#][^\s]*)?$/i.test(raw) ||
          /^\d{1,3}(\.\d{1,3}){3}(:\d+)?([/?#][^\s]*)?$/.test(raw);

        if (!hasscheme && !lookslikeurl) {
          var engine = document.getElementById("sj-search-engine").value;
          return engine.replace("%s", encodeURIComponent(raw));
        }
        return hasscheme ? raw : "https://" + raw;
      }

      function mountframe(p, resultarea) {
        if (currentframe && Array.isArray(p.frames)) {
          var oldIndex = p.frames.indexOf(currentframe);
          if (oldIndex !== -1) p.frames.splice(oldIndex, 1);
        }
        var el = document.createElement("iframe");
        el.title = "Proxied website";
        el.setAttribute("referrerpolicy", "no-referrer");
        el.setAttribute(
          "allow",
          "autoplay; fullscreen; encrypted-media; picture-in-picture",
        );
        el.style.cssText =
          "width:100%;height:100%;border:0;background:#fff;display:block;";

        Array.from(resultarea.children).forEach(function (c) {
          if (c.id !== "loading-indicator") resultarea.removeChild(c);
        });
        resultarea.appendChild(el);

        return p.createFrame(el);
      }

      async function gourl(input, fromHistory) {
        var errorel = document.getElementById("sj-error");
        var resultarea = document.getElementById("search-results");
        var container = document.getElementById("main-container");
        var loader = document.getElementById("loading-indicator");

        errorel.textContent = "";

        var finalurl = resolveurl(input);
        if (!finalurl) {
          errorel.textContent = "Enter a URL or search query.";
          return;
        }

        var version = ++navigationVersion;
        clearTimeout(loadingTimer);
        lasturl = finalurl;

        if (!fromHistory) {
          try {
            var next =
              "search.html?q=" + encodeURIComponent(String(input).trim());
            if (location.search !== "?" + next.slice("search.html?".length)) {
              history.pushState({ q: input }, "", next);
            }
          } catch (_) {}
        }

        container.classList.add("results-open");
        loader.classList.remove("hidden");
        loader.textContent = "Loading…";

        try {
          var p = await startbackend();
          if (version !== navigationVersion) return;

          currentframe = mountframe(p, resultarea);

          var frameel = currentframe.element;
          var hidden = false;
          var hide = function () {
            if (hidden || version !== navigationVersion) return;
            hidden = true;
            clearTimeout(loadingTimer);
            loader.classList.add("hidden");
          };
          frameel.addEventListener("load", hide, { once: true });
          await window.aetherisProxy.go(currentframe, finalurl);
          loadingTimer = setTimeout(function () {
            if (version !== navigationVersion || hidden) return;
            hide();
            errorel.textContent =
              "This page is taking longer than expected. Try refreshing or another URL.";
          }, 20000);
        } catch (err) {
          if (version !== navigationVersion) return;
          console.error("navigation error:", err);
          // rebuild the transport next time, it may have died while suspended
          try {
            if (window.aetherisProxy) window.aetherisProxy.reset();
          } catch (_) {}
          errorel.textContent =
            "The page could not load. Check your connection and try again.";
          loader.classList.add("hidden");
        }
      }

      function getframeurl() {
        if (currentframe) {
          var el = currentframe.element;
          try {
            var href = el.contentWindow && el.contentWindow.location.href;
            var prefix = new URL(currentframe.prefix, location.href).href;
            if (href && href.indexOf(prefix) === 0)
              return backend.config.codec.decode(href.slice(prefix.length));
            if (
              href &&
              href !== "about:blank" &&
              new URL(href).origin !== location.origin
            )
              return href;
          } catch (_) {}
        }
        return lasturl;
      }

      function toolbarfullscreen() {
        var area = document.getElementById("search-results");
        if (area) Aetheris.fullscreen(area);
      }

      function openSearchInAboutBlank() {
        var target = getframeurl();
        if (!target) return;
        var url = new URL("search.html", location.href);
        url.searchParams.set("q", target);
        openAboutBlank(url.href, "Aetheris Search");
      }

      function toolbarrefresh() {
        var errorel = document.getElementById("sj-error");
        if (currentframe && lasturl) {
          try {
            currentframe.reload();
          } catch (err) {
            console.error("refresh failed:", err);
            if (errorel)
              errorel.textContent =
                "Refresh failed. Check your connection and try again.";
          }
        } else if (errorel) {
          errorel.textContent = "Nothing to refresh yet.";
        }
      }

      document
        .getElementById("sj-form")
        .addEventListener("submit", function (e) {
          e.preventDefault();
          gourl(document.getElementById("sj-address").value);
        });

      var urlparams = new URLSearchParams(window.location.search);
      var q = urlparams.get("q");
      if (q) {
        document.getElementById("sj-address").value = q;
        gourl(q, true);
      }

      window.addEventListener("popstate", function (e) {
        var params = new URLSearchParams(window.location.search);
        var next = params.get("q") || (e.state && e.state.q) || "";
        document.getElementById("sj-address").value = next;
        if (next) {
          gourl(next, true);
          return;
        }
        // Back/forward to a URL without ?q must not leave the previous
        // proxied site displayed under an empty search field.
        navigationVersion++;
        clearTimeout(loadingTimer);
        if (
          currentframe &&
          currentframe.element &&
          currentframe.element.parentNode
        )
          currentframe.element.parentNode.removeChild(currentframe.element);
        currentframe = null;
        lasturl = null;
        document
          .getElementById("main-container")
          .classList.remove("results-open");
        document.getElementById("loading-indicator").classList.add("hidden");
        document.getElementById("sj-error").textContent = "";
      });
    </script>
  </body>
</html>
