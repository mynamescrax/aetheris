    <script>
      var UPDATE_VERSION = "12";

      async function loadquote() {
        try {
          var cached = sessionStorage.getItem("__quotes");
          var quotes = cached ? JSON.parse(cached) : null;
          if (!quotes) {
            quotes = await fetch("./quotes.json").then(function (r) {
              return r.json();
            });
            sessionStorage.setItem("__quotes", JSON.stringify(quotes));
          }
          if (!quotes.length) return;
          var el = document.getElementById("darksubtitle");
          if (el)
            el.textContent = quotes[Math.floor(Math.random() * quotes.length)];
        } catch (_) {}
      }

      function setupsearch() {
        var inputs = [
          document.querySelector(".pxyinput"),
          document.getElementById("darksearch"),
          document.getElementById("mainsearch"),
        ].filter(Boolean);
        inputs.forEach(function (input) {
          input.addEventListener("keydown", function (e) {
            if (e.key !== "Enter") return;
            var q = input.value.trim();
            if (q)
              window.location.href = "search.html?q=" + encodeURIComponent(q);
          });
        });
      }

      function showupdatemodal() {
        var backdrop = document.getElementById("updatemodal");
        var closebtn = document.getElementById("updatemodalclose");
        if (!backdrop) return;
        if (localStorage.getItem("updateDismissed") === UPDATE_VERSION) return;

        var labels = ["aight", "bet", "ok", "cool!", "great!"];
        if (closebtn)
          closebtn.textContent =
            labels[Math.floor(Math.random() * labels.length)];

        backdrop.style.display = "flex";

        function dismiss() {
          localStorage.setItem("updateDismissed", UPDATE_VERSION);
          backdrop.classList.add("fade-out");
          function hide() {
            backdrop.style.display = "none";
            backdrop.classList.remove("fade-out");
          }
          backdrop.addEventListener("animationend", hide, { once: true });
          // Performance mode disables animations, so animationend never fires.
          setTimeout(hide, 250);
        }

        closebtn.addEventListener("click", dismiss);
        backdrop.addEventListener("click", function (e) {
          if (e.target === backdrop) dismiss();
        });
        function onesc(e) {
          if (e.key === "Escape" && backdrop.style.display !== "none") {
            dismiss();
            document.removeEventListener("keydown", onesc);
          }
        }
        document.addEventListener("keydown", onesc);
      }

      document.addEventListener("DOMContentLoaded", function () {
        loadquote();
        setupsearch();
        showupdatemodal();
      });

      function eschtml(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function launchab() {
        try {
          if (
            window.parent &&
            window.parent !== window &&
            typeof window.parent.launchab === "function"
          ) {
            window.parent.launchab();
            return;
          }
        } catch (_) {}

        var siteurl;
        try {
          siteurl =
            (window.top && window.top.location && window.top.location.href) ||
            window.location.origin + "/";
        } catch (_) {
          siteurl = window.location.origin + "/";
        }

        var opener;
        try {
          opener = window.top || window;
        } catch (_) {
          opener = window;
        }

        var win = opener.open("about:blank", "_blank");
        if (!win) {
          alert("Popup blocked. Allow popups for this site and try again.");
          return;
        }

        try {
          win.document.open();
          win.document.write(
            "<!DOCTYPE html><html><head>" +
              "<style>body{margin:0;overflow:hidden;background:#000}iframe{border:none;width:100vw;height:100vh;position:fixed;inset:0}</style>" +
              "</head><body>" +
              '<iframe src="' +
              eschtml(siteurl) +
              '" allowfullscreen referrerpolicy="no-referrer"></iframe>' +
              "</body></html>",
          );
          win.document.close();
        } catch (err) {
          try {
            win.location.href = siteurl;
          } catch (_) {}
        }
      }
    </script>

    <script>
      // getdeviceid lives in ./js/dm-shared.js (loaded in <head>)

      var reporttype = "";

      function pickreporttype(btn, label) {
        document.querySelectorAll(".rtype").forEach(function (b) {
          b.classList.remove("selected");
        });
        btn.classList.add("selected");
        reporttype = label;
      }

      function openreport() {
        reporttype = "";
        document.querySelectorAll(".rtype").forEach(function (b) {
          b.classList.remove("selected");
        });
        document.getElementById("report-steps").value = "";
        document.getElementById("report-notes").value = "";
        document.getElementById("report-status").style.display = "none";
        document.getElementById("report-submit").disabled = false;
        document.getElementById("report-submit").textContent = "send it";

        var overlay = document.getElementById("report-overlay");
        var modal = document.getElementById("report-modal");
        overlay.style.display = "flex";
        modal.style.opacity = "0";
        modal.style.transform = "scale(0.92) translateY(12px)";
        modal.style.transition =
          "opacity 0.22s ease, transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1)";

        requestAnimationFrame(function () {
          modal.style.opacity = "1";
          modal.style.transform = "scale(1) translateY(0)";
        });
      }

      function closereport() {
        var overlay = document.getElementById("report-overlay");
        var modal = document.getElementById("report-modal");
        modal.style.opacity = "0";
        modal.style.transform = "scale(0.92) translateY(8px)";
        setTimeout(function () {
          overlay.style.display = "none";
        }, 200);
      }

      document
        .getElementById("report-overlay")
        .addEventListener("click", function (e) {
          if (e.target === this) closereport();
        });

      document.addEventListener("keydown", function (e) {
        var overlay = document.getElementById("report-overlay");
        if (e.key === "Escape" && overlay && overlay.style.display === "flex")
          closereport();
      });

      async function sendreport() {
        var steps = document.getElementById("report-steps").value.trim();
        var notes = document.getElementById("report-notes").value.trim();
        var submitbtn = document.getElementById("report-submit");

        if (!reporttype) {
          showstatus("pick a type first", "warn");
          return;
        }
        if (!steps) {
          showstatus("describe it first", "warn");
          return;
        }

        submitbtn.disabled = true;
        submitbtn.textContent = "sending...";

        try {
          var devid = await getdeviceid();
          var res = await fetch("/api/report", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              game: "Site feedback (home page)",
              issue: reporttype,
              steps: steps,
              notes: notes || undefined,
              url: window.location.href,
              deviceId: devid,
            }),
          });

          var data = await res.json().catch(function () {
            return {};
          });
          if (!res.ok) throw new Error(data.error || "HTTP " + res.status);

          showstatus("sent! thanks for the heads up", "ok");
          submitbtn.textContent = "sent!";
          setTimeout(closereport, 1800);
        } catch (err) {
          showstatus(err.message || "failed to send. try again.", "err");
          submitbtn.disabled = false;
          submitbtn.textContent = "send it";
          console.error("report error:", err);
        }
      }

      var STATUS_COLOURS = {
        ok: {
          bg: "rgba(34,197,94,0.15)",
          color: "#86efac",
          border: "rgba(34,197,94,0.3)",
        },
        warn: {
          bg: "rgba(234,179,8,0.15)",
          color: "#fde047",
          border: "rgba(234,179,8,0.3)",
        },
        err: {
          bg: "rgba(239,68,68,0.15)",
          color: "#fca5a5",
          border: "rgba(239,68,68,0.3)",
        },
      };

      function showstatus(message, type) {
        var el = document.getElementById("report-status");
        var c = STATUS_COLOURS[type] || STATUS_COLOURS.err;
        el.textContent = message;
        el.style.display = "block";
        el.style.background = c.bg;
        el.style.color = c.color;
        el.style.border = "1px solid " + c.border;
      }
    </script>
  </body>
</html>
